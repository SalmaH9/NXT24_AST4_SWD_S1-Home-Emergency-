<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - Fixora</title>
    <link rel="stylesheet" href="../css/register.css" />
    <link rel="stylesheet" href="../css/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        /* ==========================================
           RESET
           ========================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background: #f5f4f7;
            position: relative;
            overflow-y: auto;
        }

        /* ==========================================
           VIBRANT BACKGROUND
           ========================================== */
        .vibrant-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .vibrant-bg .circle {
            position: absolute;
            border-radius: 50%;
            opacity: 0.12;
            animation: vibrantFloat 22s ease-in-out infinite;
        }

        .vibrant-bg .circle:nth-child(1) {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #667eea, #764ba2);
            top: -200px;
            right: -150px;
            animation-duration: 28s;
        }

        .vibrant-bg .circle:nth-child(2) {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #f093fb, #f5576c);
            bottom: -150px;
            left: -120px;
            animation-duration: 24s;
            animation-delay: 2s;
        }

        .vibrant-bg .circle:nth-child(3) {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, #4facfe, #00f2fe);
            top: 30%;
            right: -5%;
            animation-duration: 20s;
            animation-delay: 4s;
            opacity: 0.08;
        }

        .vibrant-bg .circle:nth-child(4) {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #43e97b, #38f9d7);
            bottom: 20%;
            left: -5%;
            animation-duration: 26s;
            animation-delay: 1s;
            opacity: 0.1;
        }

        .vibrant-bg .sparkle {
            position: absolute;
            border-radius: 50%;
            animation: sparkleFloat 12s ease-in-out infinite;
        }

        .vibrant-bg .sparkle:nth-child(5) {
            width: 6px;
            height: 6px;
            top: 15%;
            left: 10%;
            animation-duration: 10s;
            background: #667eea;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.4);
        }

        .vibrant-bg .sparkle:nth-child(6) {
            width: 8px;
            height: 8px;
            top: 70%;
            right: 15%;
            animation-duration: 14s;
            animation-delay: 2s;
            background: #f5576c;
            box-shadow: 0 0 20px rgba(245, 87, 108, 0.4);
        }

        .vibrant-bg .sparkle:nth-child(7) {
            width: 5px;
            height: 5px;
            top: 40%;
            left: 85%;
            animation-duration: 11s;
            animation-delay: 4s;
            background: #4facfe;
            box-shadow: 0 0 20px rgba(79, 172, 254, 0.4);
        }

        .vibrant-bg .sparkle:nth-child(8) {
            width: 7px;
            height: 7px;
            top: 80%;
            left: 20%;
            animation-duration: 13s;
            animation-delay: 1s;
            background: #43e97b;
            box-shadow: 0 0 20px rgba(67, 233, 123, 0.4);
        }

        @keyframes vibrantFloat {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 0.08; }
            25% { transform: translate(40px, -30px) scale(1.15) rotate(45deg); opacity: 0.15; }
            50% { transform: translate(-25px, 25px) scale(0.85) rotate(90deg); opacity: 0.08; }
            75% { transform: translate(20px, -15px) scale(1.08) rotate(135deg); opacity: 0.12; }
            100% { transform: translate(0, 0) scale(1) rotate(180deg); opacity: 0.08; }
        }

        @keyframes sparkleFloat {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.3; }
            25% { transform: translate(30px, -25px) scale(1.8); opacity: 1; }
            50% { transform: translate(-20px, 20px) scale(0.5); opacity: 0.2; }
            75% { transform: translate(15px, -10px) scale(1.5); opacity: 0.8; }
        }

        /* ==========================================
           REGISTER CONTAINER
           ========================================== */
        .register-container {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 32px;
            padding: 50px 45px;
            max-width: 520px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.06), 
                        0 10px 30px rgba(0, 0, 0, 0.02),
                        inset 0 1px 0 rgba(255, 255, 255, 0.5);
            position: relative;
            z-index: 1;
            animation: slideIn 0.8s ease forwards;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ===== HEADER ===== */
        .register-header {
            text-align: center;
            margin-bottom: 34px;
        }

        .register-header .logo-wrapper {
            width: 72px;
            height: 72px;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.04);
            animation: logoPulse 3s ease-in-out infinite;
        }

        @keyframes logoPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .register-header .logo-wrapper i {
            font-size: 2.2rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .register-header h1 {
            font-size: 2rem;
            font-weight: 800;
            color: #1a202c;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }

        .register-header p {
            color: rgba(26, 32, 44, 0.5);
            font-size: 0.95rem;
        }

        /* ===== ROLE SELECTOR ===== */
        .role-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 28px;
        }

        .role-option {
            padding: 16px 12px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        .role-option:hover {
            border-color: rgba(102, 126, 234, 0.3);
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.35);
        }

        .role-option.active {
            border-color: #667eea;
            background: rgba(255, 255, 255, 0.45);
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.06);
        }

        .role-option i {
            font-size: 2rem;
            display: block;
            margin-bottom: 6px;
            color: rgba(26, 32, 44, 0.25);
            transition: 0.3s;
        }

        .role-option.active i {
            color: #667eea;
        }

        .role-option .role-title {
            font-weight: 700;
            font-size: 1rem;
            color: #1a202c;
            display: block;
        }

        .role-option .role-desc {
            font-size: 0.7rem;
            font-weight: 500;
            color: rgba(26, 32, 44, 0.35);
            display: block;
            margin-top: 2px;
        }

        .role-option.active .role-desc {
            color: #667eea;
        }

        .role-option input[type="radio"] {
            display: none;
        }

        /* ===== FORM GROUPS ===== */
        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            color: rgba(26, 32, 44, 0.6);
            margin-bottom: 6px;
        }

        .form-group .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .form-group .input-wrapper .input-icon {
            position: absolute;
            left: 16px;
            color: rgba(26, 32, 44, 0.25);
            font-size: 1rem;
            transition: 0.3s;
            pointer-events: none;
        }

        .form-group .input-wrapper input {
            width: 100%;
            padding: 16px 16px 16px 48px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 16px;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            color: #1a202c;
            transition: 0.3s;
            outline: none;
        }

        .form-group .input-wrapper input::placeholder {
            color: rgba(26, 32, 44, 0.2);
        }

        .form-group .input-wrapper input:focus {
            border-color: #667eea;
            background: rgba(255, 255, 255, 0.35);
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.04);
        }

        .form-group .input-wrapper input:focus ~ .input-icon {
            color: #667eea;
        }

        .password-toggle {
            position: absolute;
            right: 16px;
            background: none;
            border: none;
            color: rgba(26, 32, 44, 0.25);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 8px;
            transition: 0.3s;
            border-radius: 8px;
        }

        .password-toggle:hover {
            color: #667eea;
            background: rgba(255, 255, 255, 0.1);
        }

        /* ===== TERMS ===== */
        .terms-check {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 24px;
        }

        .terms-check input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #667eea;
            margin-top: 2px;
            cursor: pointer;
        }

        .terms-check label {
            font-size: 0.85rem;
            color: rgba(26, 32, 44, 0.5);
            line-height: 1.5;
        }

        .terms-check label a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .terms-check label a:hover {
            text-decoration: underline;
        }

        /* ===== REGISTER BUTTON ===== */
        .btn-register {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            position: relative;
            overflow: hidden;
        }

        .btn-register:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(102, 126, 234, 0.2);
        }

        .btn-register:active {
            transform: scale(0.98);
        }

        .btn-register::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent 30%,
                rgba(255, 255, 255, 0.15) 50%,
                transparent 70%
            );
            animation: shimmerBtn 4s infinite;
            transform: rotate(45deg);
        }

        @keyframes shimmerBtn {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }

        /* ===== DIVIDER ===== */
        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 22px 0 24px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.4);
        }

        .divider span {
            color: rgba(26, 32, 44, 0.25);
            font-size: 0.8rem;
            font-weight: 500;
            white-space: nowrap;
        }

        /* ===== SOCIAL LOGIN ===== */
        .social-login {
            display: flex;
            gap: 14px;
            justify-content: center;
        }

        .social-login a {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(26, 32, 44, 0.25);
            transition: all 0.3s ease;
            font-size: 1.2rem;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        .social-login a:hover {
            border-color: #667eea;
            color: #667eea;
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.3);
        }

        /* ===== FOOTER ===== */
        .register-footer {
            text-align: center;
            margin-top: 26px;
        }

        .register-footer p {
            color: rgba(26, 32, 44, 0.35);
            font-size: 0.9rem;
        }

        .register-footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: 700;
            transition: 0.3s;
        }

        .register-footer a:hover {
            color: #5a67d8;
            text-decoration: underline;
        }

        /* ===== ERROR MESSAGE ===== */
        .error-message {
            background: rgba(229, 62, 62, 0.06);
            color: #e53e3e;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.9rem;
            margin-bottom: 18px;
            display: none;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(229, 62, 62, 0.08);
            backdrop-filter: blur(5px);
        }

        .error-message.show {
            display: flex;
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        /* ===== PROVIDER NOTE ===== */
        .provider-note {
            background: rgba(102, 126, 234, 0.08);
            border: 1px solid rgba(102, 126, 234, 0.15);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 20px;
            display: none;
            align-items: flex-start;
            gap: 10px;
        }

        .provider-note.show {
            display: flex;
        }

        .provider-note i {
            color: #667eea;
            font-size: 1.1rem;
            margin-top: 2px;
        }

        .provider-note p {
            font-size: 0.85rem;
            color: rgba(26, 32, 44, 0.6);
            line-height: 1.5;
            margin: 0;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .register-container {
                padding: 32px 24px;
                border-radius: 24px;
            }
            .register-header h1 {
                font-size: 1.6rem;
            }
            .register-header .logo-wrapper {
                width: 60px;
                height: 60px;
            }
            .register-header .logo-wrapper i {
                font-size: 1.8rem;
            }
            .role-selector {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            .role-option {
                padding: 12px 8px;
            }
            .role-option i {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>

    <!-- ===== VIBRANT BACKGROUND ===== -->
    <div class="vibrant-bg">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
    </div>

    <!-- ===== REGISTER CONTAINER ===== -->
    <div class="register-container">

        <!-- Header -->
        <div class="register-header">
            <div class="logo-wrapper">
                <i class="fas fa-wrench"></i>
            </div>
            <h1>Create Account</h1>
            <p>Join Fixora and get things fixed</p>
        </div>

        <!-- Register Form -->
        <form class="register-form" id="registerForm" onsubmit="handleRegister(event)">

            <!-- Error Message -->
            <div class="error-message" id="errorMessage">
                <i class="fas fa-circle-exclamation"></i>
                <span id="errorText">Something went wrong</span>
            </div>

            <!-- Role Selector -->
            <div class="role-selector">
                <label class="role-option active" id="customerRole">
                    <input type="radio" name="role" value="customer" checked />
                    <i class="fas fa-user"></i>
                    <span class="role-title">Customer</span>
                    <span class="role-desc">Book Services</span>
                </label>
                <label class="role-option" id="providerRole">
                    <input type="radio" name="role" value="provider" />
                    <i class="fas fa-user-tie"></i>
                    <span class="role-title">Provider</span>
                    <span class="role-desc">Offer Services</span>
                </label>
            </div>

            <!-- Provider Note -->
            <div class="provider-note" id="providerNote">
                <i class="fas fa-info-circle"></i>
                <p>As a provider, you'll need to complete your profile and upload verification documents after registration.</p>
            </div>

            <!-- Full Name -->
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <div class="input-wrapper">
                    <input type="text" id="fullName" placeholder="John Doe" required />
                    <i class="fas fa-user input-icon"></i>
                </div>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-wrapper">
                    <input type="email" id="email" placeholder="you@example.com" required />
                    <i class="fas fa-envelope input-icon"></i>
                </div>
            </div>

            <!-- Phone -->
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <div class="input-wrapper">
                    <input type="tel" id="phone" placeholder="+966 50 123 4567" required />
                    <i class="fas fa-phone input-icon"></i>
                </div>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="••••••••" required minlength="8" />
                    <i class="fas fa-lock input-icon"></i>
                    <button type="button" class="password-toggle" id="togglePassword">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <!-- Confirm Password -->
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <div class="input-wrapper">
                    <input type="password" id="confirmPassword" placeholder="••••••••" required />
                    <i class="fas fa-lock input-icon"></i>
                </div>
            </div>

            <!-- Terms -->
            <div class="terms-check">
                <input type="checkbox" id="agreeTerms" required />
                <label for="agreeTerms">
                    I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
                </label>
            </div>

            <!-- Register Button -->
            <button type="submit" class="btn-register">
                <i class="fas fa-user-plus"></i> Create Account
            </button>

            <!-- Divider -->
            <div class="divider">
                <span>or sign up with</span>
            </div>

            <!-- Social Login -->
            <div class="social-login">
                <a href="#"><i class="fab fa-google"></i></a>
                <a href="#"><i class="fab fa-apple"></i></a>
                <a href="#"><i class="fab fa-github"></i></a>
            </div>
        </form>

        <!-- Footer -->
        <div class="register-footer">
            <p>Already have an account? <a href="login.html">Sign In</a></p>
        </div>

    </div>

    <script>
        // ==========================================
        // ROLE SELECTOR
        // ==========================================
        const customerRole = document.getElementById('customerRole');
        const providerRole = document.getElementById('providerRole');
        const providerNote = document.getElementById('providerNote');

        customerRole.addEventListener('click', function() {
            this.classList.add('active');
            providerRole.classList.remove('active');
            document.querySelector('input[name="role"][value="customer"]').checked = true;
            providerNote.classList.remove('show');
        });

        providerRole.addEventListener('click', function() {
            this.classList.add('active');
            customerRole.classList.remove('active');
            document.querySelector('input[name="role"][value="provider"]').checked = true;
            providerNote.classList.add('show');
        });

        // ==========================================
        // TOGGLE PASSWORD
        // ==========================================
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', function() {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            const icon = this.querySelector('i');
            icon.classList.toggle('fa-eye');
            icon.classList.toggle('fa-eye-slash');
        });

        // ==========================================
        // HANDLE REGISTER
        // ==========================================
        function handleRegister(event) {
            event.preventDefault();

            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errorMessage = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            const role = document.querySelector('input[name="role"]:checked').value;

            // Validation
            if (fullName === '' || email === '' || phone === '' || password === '') {
                errorText.textContent = 'Please fill in all fields';
                errorMessage.classList.add('show');
                return;
            }

            if (password.length < 8) {
                errorText.textContent = 'Password must be at least 8 characters';
                errorMessage.classList.add('show');
                return;
            }

            if (password !== confirmPassword) {
                errorText.textContent = 'Passwords do not match';
                errorMessage.classList.add('show');
                return;
            }

            // Simulate registration success
            errorMessage.classList.remove('show');

            // Store user data
            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('userRole', role);
            localStorage.setItem('userEmail', email);
            localStorage.setItem('userName', fullName);
            localStorage.setItem('userPhone', phone);
            localStorage.setItem('isVerified', 'false'); // Provider needs verification

            // Show success and redirect
            alert('✅ Account created successfully!');

            if (role === 'customer') {
                window.location.href = 'customer-dashboard.html';
            } else if (role === 'provider') {
                // Provider goes to verification page first
                window.location.href = 'provider-verification.html';
            }
        }

        // ==========================================
        // REAL-TIME VALIDATION
        // ==========================================
        document.querySelectorAll('#registerForm input').forEach(input => {
            input.addEventListener('input', () => {
                document.getElementById('errorMessage').classList.remove('show');
            });
        });
    </script>

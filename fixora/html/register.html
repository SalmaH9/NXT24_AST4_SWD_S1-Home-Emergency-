<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - Fixora</title>
    <link rel="stylesheet" href="../css/register.css" />
    <link rel="stylesheet" href="../css/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
            overflow-y: auto;
            background:
                linear-gradient(rgba(255,255,255,.14), rgba(255,255,255,.14)),
                linear-gradient(rgba(0,0,0,.22), rgba(0,0,0,.22)),
                url("./images/wall.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .register-container {
            background: rgba(255, 252, 248, 0.94);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 32px;
            max-width: 468px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.72);
            box-shadow: 0 28px 70px rgba(23, 30, 54, 0.14),
                        0 10px 24px rgba(23, 30, 54, 0.08),
                        inset 0 1px 0 rgba(255, 255, 255, 0.85);
            position: relative;
            z-index: 1;
            animation: slideIn 0.8s ease forwards;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes logoPulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.02);
            }
        }

        @keyframes shimmerBtn {
            0% {
                transform: translateX(-100%) rotate(45deg);
            }
            100% {
                transform: translateX(100%) rotate(45deg);
            }
        }

        @keyframes shake {
            0%, 100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-8px);
            }
            75% {
                transform: translateX(8px);
            }
        }

        .register-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .register-header .logo-wrapper {
            width: 54px;
            height: 54px;
            background: rgba(244, 247, 255, 0.92);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            border: 1px solid rgba(214, 223, 246, 0.85);
            box-shadow: 0 12px 28px rgba(32, 46, 88, 0.08);
            animation: logoPulse 3s ease-in-out infinite;
        }

        .register-header .logo-wrapper i {
            font-size: 1.5rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .register-header h1 {
            font-size: 2rem;
            font-weight: 800;
            color: #1a202c;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }

        .register-header p {
            color: rgba(26, 32, 44, 0.62);
            font-size: 0.95rem;
        }

        .register-form {
            position: relative;
        }

        .register-tabs {
            display: flex;
            background: rgba(233, 238, 249, 0.88);
            padding: 4px;
            border-radius: 14px;
            margin-bottom: 14px;
        }

        .register-tabs .tab {
            flex: 1;
            border: 0;
            background: transparent;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            color: rgba(26, 32, 44, 0.7);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .register-tabs .tab.active {
            background: #ffffff;
            color: #4f6ef7;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .role-inputs {
            display: none;
        }

        .provider-note {
            display: none;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 14px;
            padding: 12px 14px;
            border-radius: 14px;
            background: rgba(244, 247, 255, 0.78);
            border: 1px solid rgba(214, 223, 246, 0.78);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .provider-note.show {
            display: flex;
        }

        .provider-note i {
            color: #667eea;
            font-size: 0.95rem;
            margin-top: 2px;
        }

        .provider-note p {
            color: rgba(26, 32, 44, 0.64);
            font-size: 0.8rem;
            line-height: 1.45;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            color: rgba(26, 32, 44, 0.6);
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            color: rgba(26, 32, 44, 0.25);
            font-size: 1rem;
            transition: 0.3s;
            pointer-events: none;
        }

        .input-wrapper input {
            width: 100%;
            height: 48px;
            padding: 14px 16px 14px 46px;
            border: 1px solid rgba(218, 225, 242, 0.95);
            border-radius: 16px;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            background: rgba(255, 255, 255, 0.98);
            color: #1a202c;
            transition: 0.3s;
            outline: none;
        }

        .input-wrapper input::placeholder {
            color: rgba(26, 32, 44, 0.2);
        }

        .input-wrapper input:hover {
            background: #ffffff;
            border-color: rgba(198, 210, 238, 0.95);
        }

        .input-wrapper input:focus {
            border-color: #667eea;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.08);
        }

        .input-wrapper input:focus ~ .input-icon {
            color: #667eea;
        }

        .password-toggle {
            position: absolute;
            right: 16px;
            background: none;
            border: none;
            color: rgba(26, 32, 44, 0.25);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 8px;
            transition: 0.3s;
            border-radius: 8px;
        }

        .password-toggle:hover {
            color: #667eea;
            background: rgba(238, 243, 255, 0.88);
        }

        .password-hint {
            font-size: 0.75rem;
            color: rgba(26, 32, 44, 0.45);
            margin-top: 6px;
            padding-left: 4px;
        }

        .terms-check {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin: 4px 0 18px;
        }

        .terms-check input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-top: 2px;
            accent-color: #667eea;
            cursor: pointer;
        }

        .terms-check label {
            font-size: 0.83rem;
            color: rgba(26, 32, 44, 0.54);
            line-height: 1.45;
        }

        .terms-check label a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .terms-check label a:hover {
            color: #5a67d8;
            text-decoration: underline;
        }

        .btn-register {
            width: 100%;
            height: 52px;
            padding: 0 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            position: relative;
            overflow: hidden;
        }

        .btn-register:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(102, 126, 234, 0.2);
        }

        .btn-register:active {
            transform: scale(0.98);
        }

        .btn-register:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .btn-register::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent 30%,
                rgba(255, 255, 255, 0.15) 50%,
                transparent 70%
            );
            animation: shimmerBtn 4s infinite;
            transform: rotate(45deg);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 18px 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(210, 218, 236, 0.92);
        }

        .divider span {
            color: rgba(26, 32, 44, 0.34);
            font-size: 0.8rem;
            font-weight: 500;
            white-space: nowrap;
        }

        .social-login {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .social-login a {
            width: 54px;
            height: 54px;
            border-radius: 16px;
            border: 1px solid rgba(218, 225, 242, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(26, 32, 44, 0.7);
            transition: all 0.3s ease;
            font-size: 1.1rem;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.98);
        }

        .social-login a:hover {
            border-color: #667eea;
            color: #667eea;
            transform: translateY(-2px);
            background: #ffffff;
        }

        .social-login a i {
            font-size: 1.1rem;
        }

        .register-footer {
            text-align: center;
            margin-top: 18px;
        }

        .register-footer p {
            color: rgba(26, 32, 44, 0.42);
            font-size: 0.9rem;
        }

        .register-footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: 700;
            transition: 0.3s;
        }

        .register-footer a:hover {
            color: #5a67d8;
            text-decoration: underline;
        }

        .error-message {
            background: rgba(229, 62, 62, 0.08);
            color: #e53e3e;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.9rem;
            margin-bottom: 14px;
            display: none;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(229, 62, 62, 0.12);
        }

        .error-message.show {
            display: flex;
            animation: shake 0.5s ease;
        }

        @media (max-width: 480px) {
            body {
                padding: 20px 14px;
            }

            .register-container {
                padding: 26px 22px;
                border-radius: 20px;
            }

            .register-header h1 {
                font-size: 1.65rem;
            }

            .register-tabs .tab {
                padding: 11px 8px;
                font-size: 0.9rem;
            }

            .social-login a {
                width: 50px;
                height: 50px;
            }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-header">
            <div class="logo-wrapper">
                <i class="fas fa-wrench"></i>
            </div>
            <h1>Create Account</h1>
            <p>Join Fixora and get things fixed</p>
        </div>

        <form class="register-form" id="registerForm" onsubmit="handleRegister(event)">
            <div class="error-message" id="errorMessage">
                <i class="fas fa-circle-exclamation"></i>
                <span id="errorText">Something went wrong</span>
            </div>

            <div class="register-tabs">
                <button type="button" class="tab active" id="customerTab">Customer</button>
                <button type="button" class="tab" id="providerTab">Provider</button>
            </div>

            <div class="role-inputs" aria-hidden="true">
                <input type="radio" name="role" value="customer" checked />
                <input type="radio" name="role" value="provider" />
            </div>

            <div class="provider-note" id="providerNote">
                <i class="fas fa-info-circle"></i>
                <p>Providers complete a profile and upload verification documents after registration.</p>
            </div>

            <div class="form-group">
                <label for="fullName">Full Name</label>
                <div class="input-wrapper">
                    <input type="text" id="fullName" placeholder="John Doe" required maxlength="150" />
                    <i class="fas fa-user input-icon"></i>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-wrapper">
                    <input type="email" id="email" placeholder="you@example.com" required />
                    <i class="fas fa-envelope input-icon"></i>
                </div>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <div class="input-wrapper">
                    <input type="tel" id="phone" placeholder="+20 100 123 4567" required />
                    <i class="fas fa-phone input-icon"></i>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="........" required minlength="8" />
                    <i class="fas fa-lock input-icon"></i>
                    <button type="button" class="password-toggle" id="togglePassword">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <div class="password-hint">
                    <i class="fas fa-circle-info"></i>
                    At least 8 characters, including a lowercase letter and a number.
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <div class="input-wrapper">
                    <input type="password" id="confirmPassword" placeholder="........" required />
                    <i class="fas fa-lock input-icon"></i>
                </div>
            </div>

            <div class="terms-check">
                <input type="checkbox" id="agreeTerms" required />
                <label for="agreeTerms">
                    I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
                </label>
            </div>

            <button type="submit" class="btn-register">
                <i class="fas fa-user-plus"></i> Create Account
            </button>

            <div class="divider">
                <span>or continue with</span>
            </div>

            <div class="social-login">
                <a href="#" aria-label="Continue with Google"><i class="fab fa-google"></i></a>
                <a href="#" aria-label="Continue with Apple"><i class="fab fa-apple"></i></a>
            </div>
        </form>

        <div class="register-footer">
            <p>Already have an account? <a href="login.html">Sign In</a></p>
        </div>
    </div>

    <!-- ==========================================
         SCRIPTS — الترتيب مهم جدًا
         نفس ترتيب login.html بالظبط
         ========================================== -->
    <script src="../js/config.js"></script>
    <script src="../js/tokenManager.js"></script>
    <script src="../js/loading.js"></script>
    <script src="../js/errorHandler.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/register.js"></script>
    <script src="../js/chatbot.js"></script>
</body>
</html>

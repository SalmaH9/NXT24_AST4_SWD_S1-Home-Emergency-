<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile - Fixora</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        .profile-header { display: flex; align-items: center; gap: 30px; padding: 30px; background: var(--bg-card); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--border); flex-wrap: wrap; }
        .profile-avatar { width: 100px; height: 100px; border-radius: 50%; background: var(--gradient-primary); display: flex; align-items: center; justify-content: center; font-size: 3rem; color: white; flex-shrink: 0; }
        .profile-name h2 { color: var(--text-primary); margin: 0; font-size: 1.8rem; }
        .profile-name .role-tag { background: var(--accent); color: white; padding: 4px 16px; border-radius: 60px; font-size: 0.75rem; font-weight: 700; display: inline-block; margin-top: 4px; }
        .profile-name p { color: var(--text-secondary); margin: 4px 0 0; }
        .profile-stats { display: flex; gap: 30px; margin-left: auto; flex-wrap: wrap; }
        .profile-stat { text-align: center; }
        .profile-stat h3 { color: var(--text-primary); font-size: 1.6rem; margin: 0; }
        .profile-stat p { color: var(--text-secondary); font-size: 0.8rem; margin: 0; }
        .profile-details { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 24px; }
        .detail-card { background: var(--bg-card); padding: 24px; border-radius: var(--radius-sm); border: 1px solid var(--border); box-shadow: var(--shadow); }
        .detail-card h3 { color: var(--text-primary); font-size: 1rem; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
        .detail-card h3 i { color: var(--accent); }
        .detail-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); }
        .detail-item:last-child { border-bottom: none; }
        .detail-item .label { color: var(--text-secondary); font-weight: 500; }
        .detail-item .value { color: var(--text-primary); font-weight: 600; }
        .edit-btn { background: var(--gradient-primary); color: white; border: none; padding: 12px 32px; border-radius: 12px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: var(--transition); font-family: 'Inter', sans-serif; margin-top: 16px; }
        .edit-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(102, 126, 234, 0.35); }
        @media (max-width: 768px) { .profile-header { flex-direction: column; text-align: center; } .profile-stats { margin-left: 0; width: 100%; justify-content: center; } .profile-details { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <button class="sidebar-toggle" id="sidebar-toggle"><i class="fas fa-bars"></i></button>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <div class="page-wrapper">
        <!-- ========================================== -->
        <!-- SIDEBAR - ديناميكي حسب الدور               -->
        <!-- ========================================== -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fas fa-wrench"></i>
                    <span>Fix<span class="logo-highlight">ora</span></span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <ul id="sidebarNav">
                    <!-- ✅ سيتم إضافتها بواسطة JavaScript حسب الدور -->
                </ul>
            </nav>
            <div class="sidebar-footer">
                <button id="theme-toggle" class="theme-btn-sidebar">
                    <i class="fas fa-moon"></i> Dark Mode
                </button>
            </div>
        </aside>

        <div class="main-area">
            <main class="main-content">
                <div class="container">
                    <h1 class="page-title">
                        <i class="fas fa-user"></i> My Profile
                    </h1>

                    <!-- ===== HEADER ===== -->
                    <div class="profile-header">
                        <div class="profile-avatar"><i class="fas fa-user"></i></div>
                        <div class="profile-name">
                            <h2 id="profileName">—</h2>
                            <span class="role-tag" id="profileRoleTag">Customer</span>
                            <p id="profileSpecialty">📍 Loading...</p>
                        </div>
                        <div class="profile-stats">
                            <div class="profile-stat"><h3 id="profileOrders">—</h3><p>Total Orders</p></div>
                            <div class="profile-stat"><h3 id="profileCompleted">—</h3><p>Completed</p></div>
                            <div class="profile-stat"><h3 id="profileRating">— ⭐</h3><p>Rating</p></div>
                        </div>
                    </div>

                    <!-- ===== DETAILS ===== -->
                    <div class="profile-details">
                        <div class="detail-card">
                            <h3><i class="fas fa-circle-info"></i> Personal Information</h3>
                            <div class="detail-item"><span class="label">Full Name</span><span class="value" id="profileName2">—</span></div>
                            <div class="detail-item"><span class="label">Email</span><span class="value" id="profileEmail">—</span></div>
                            <div class="detail-item"><span class="label">Phone</span><span class="value" id="profilePhone">—</span></div>
                            <div class="detail-item"><span class="label">Address</span><span class="value" id="profileAddress">—</span></div>
                        </div>
                        <div class="detail-card">
                            <h3><i class="fas fa-briefcase"></i> Account Info</h3>
                            <div class="detail-item"><span class="label">Role</span><span class="value" id="profileRole2">—</span></div>
                            <div class="detail-item"><span class="label">Status</span><span class="value" id="profileStatus">—</span></div>
                            <div class="detail-item"><span class="label">Member Since</span><span class="value" id="profileMemberSince">—</span></div>
                        </div>
                        <div class="detail-card" style="grid-column: 1 / -1;">
                            <h3><i class="fas fa-pen-to-square"></i> About Me</h3>
                            <p id="profileBio" style="color: var(--text-secondary); line-height: 1.8;">—</p>
                            <button class="edit-btn" onclick="editProfile()"><i class="fas fa-pen"></i> Edit Profile</button>
                        </div>
                    </div>

                </div>
            </main>

            <footer class="footer">
                <p>© 2026 <strong>Fixora</strong> — Professional Home Repair Services</p>
                <p class="footer-update">Last updated: <span id="footer-date"></span></p>
            </footer>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- SCRIPTS                                     -->
    <!-- ========================================== -->
    <script src="../js/config.js"></script>
    <script src="../js/tokenManager.js"></script>
    <script src="../js/loading.js"></script>
    <script src="../js/errorHandler.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/footer.js"></script>
    <script>
        let currentProfileData = null;

        // ==========================================
        // تحديث الـ Sidebar حسب الدور
        // ==========================================
        function updateSidebarNavigation() {
            const role = localStorage.getItem('userRole');
            const sidebarNav = document.getElementById('sidebarNav');
            if (!sidebarNav) return;

            let links = '';

            if (role === 'customer') {
                links = `
                    <li><a href="customer-dashboard.html"><i class="fas fa-gauge-high"></i> Dashboard</a></li>
                    <li><a href="post-request.html"><i class="fas fa-plus-circle"></i> Post Request</a></li>
                    <li><a href="my-orders.html"><i class="fas fa-list-check"></i> My Orders</a></li>
                    <li><a href="track-order.html"><i class="fas fa-location-dot"></i> Track Order</a></li>
                    <li><a href="chat.html"><i class="fas fa-comments"></i> Messages</a></li>
                    <li><a href="customer-profile.html" class="active"><i class="fas fa-user"></i> Profile</a></li>
                    <li style="margin-top: 16px; border-top: 1px solid var(--border); padding-top: 12px;">
                        <a href="index.html" onclick="handleLogout(event)" style="color: #ef4444; font-weight: 600;">
                            <i class="fas fa-sign-out-alt" style="margin-right: 10px;"></i> Logout
                        </a>
                    </li>
                `;
            } else if (role === 'provider' || role === 'company') {
                links = `
                    <li><a href="provider-dashboard.html"><i class="fas fa-gauge-high"></i> Dashboard</a></li>
                    <li><a href="orders.html"><i class="fas fa-list-check"></i> Orders</a></li>
                    <li><a href="schedule.html"><i class="fas fa-calendar-days"></i> Schedule</a></li>
                    <li><a href="chat.html"><i class="fas fa-comments"></i> Messages</a></li>
                    <li><a href="subscription.html"><i class="fas fa-crown"></i> Subscription</a></li>
                    <li><a href="examination.html"><i class="fas fa-file-medical"></i> Examination</a></li>
                    <li><a href="profile.html"><i class="fas fa-user-gear"></i> Profile</a></li>
                    <li style="margin-top: 16px; border-top: 1px solid var(--border); padding-top: 12px;">
                        <a href="index.html" onclick="handleLogout(event)" style="color: #ef4444; font-weight: 600;">
                            <i class="fas fa-sign-out-alt" style="margin-right: 10px;"></i> Logout
                        </a>
                    </li>
                `;
            } else {
                links = `
                    <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
                    <li><a href="login.html"><i class="fas fa-right-to-bracket"></i> Login</a></li>
                    <li><a href="register.html"><i class="fas fa-user-plus"></i> Sign Up</a></li>
                `;
            }

            sidebarNav.innerHTML = links;
        }

        // ==========================================
        // تحميل بيانات البروفايل
        // ==========================================
        async function loadProfile() {
            try {
                const profile = await api.get('/profile', { showLoader: false, silent: true });
                if (profile) {
                    currentProfileData = profile;
                    
                    // Main Header Details
                    document.getElementById('profileName').textContent = profile.fullName || '—';
                    document.getElementById('profileName2').textContent = profile.fullName || '—';
                    document.getElementById('profileEmail').textContent = profile.email || '—';
                    document.getElementById('profilePhone').textContent = profile.phoneNumber || 'Not Set';
                    document.getElementById('profileRole2').textContent = profile.role || '—';
                    document.getElementById('profileRoleTag').textContent = profile.role || 'Customer';

                    // Customer Profile Details
                    const customerProfile = profile.customerProfile || {};
                    document.getElementById('profileAddress').textContent = customerProfile.defaultAddress || 'Not Set';
                    document.getElementById('profileStatus').textContent = profile.status || 'Active';
                    
                    // Member since
                    var memberSince = profile.createdAt ? new Date(profile.createdAt).toLocaleDateString('en-US', {
                        year: 'numeric', month: 'long', day: 'numeric'
                    }) : '—';
                    document.getElementById('profileMemberSince').textContent = memberSince;

                    // Stats - Orders
                    try {
                        const orders = await api.get('/service-requests/my-requests', { showLoader: false, silent: true });
                        if (orders) {
                            document.getElementById('profileOrders').textContent = orders.length || 0;
                            const completed = orders.filter(o => o.status === 'Completed').length;
                            document.getElementById('profileCompleted').textContent = completed || 0;
                        }
                    } catch (e) {
                        document.getElementById('profileOrders').textContent = '—';
                        document.getElementById('profileCompleted').textContent = '—';
                    }

                    // Rating
                    try {
                        const summary = await api.get(`/users/${profile.id}/rating-summary`, { showLoader: false, silent: true });
                        if (summary && summary.totalRatings > 0) {
                            document.getElementById('profileRating').textContent = summary.averageRating.toFixed(1) + ' ⭐';
                        } else {
                            document.getElementById('profileRating').textContent = '— ⭐';
                        }
                    } catch (e) {
                        document.getElementById('profileRating').textContent = '— ⭐';
                    }

                    // Bio
                    document.getElementById('profileBio').textContent = customerProfile.bio || 'No bio yet.';

                    // Specialty
                    document.getElementById('profileSpecialty').textContent = customerProfile.preferredLanguage ? 
                        `📍 ${customerProfile.preferredLanguage}` : '📍 No location set';
                }
            } catch (err) {
                console.error('Failed to load profile:', err);
            }
        }

        // ==========================================
        // تعديل البروفايل
        // ==========================================
        async function editProfile() {
            if (!currentProfileData) return;

            const customerProfile = currentProfileData.customerProfile || {};

            const newName = prompt('Enter your full name:', currentProfileData.fullName);
            if (newName === null) return;
            if (!newName.trim()) {
                ErrorHandler.showNotification('Validation Error', 'Full Name cannot be empty', 'error');
                return;
            }

            const newPhone = prompt('Enter your phone number:', currentProfileData.phoneNumber || '');
            if (newPhone === null) return;

            const newAddress = prompt('Enter your address:', customerProfile.defaultAddress || '');
            if (newAddress === null) return;

            const newBio = prompt('Enter a short bio:', customerProfile.bio || '');
            if (newBio === null) return;

            try {
                const success = await api.put('/profile', {
                    fullName: newName.trim(),
                    phoneNumber: newPhone.trim(),
                    defaultAddress: newAddress.trim(),
                    bio: newBio.trim()
                });

                if (success) {
                    ErrorHandler.showNotification('Success', 'Profile updated successfully!', 'success');
                    loadProfile();
                }
            } catch (err) {
                console.error('Failed to update profile:', err);
            }
        }

        // ==========================================
        // تسجيل الخروج
        // ==========================================
        function handleLogout(event) {
            event.preventDefault();
            Auth.logout();
        }

        // ==========================================
        // INIT
        // ==========================================
        document.addEventListener('DOMContentLoaded', function() {
            // ✅ تحديث الـ Sidebar
            updateSidebarNavigation();
            
            // ✅ التحقق من الصلاحيات
            if (Auth.checkAuth(['customer'])) {
                loadProfile();
            }
            
            // ✅ تحديث تاريخ الفوتر
            var footerDate = document.getElementById('footer-date');
            if (footerDate) {
                footerDate.textContent = new Date().toLocaleDateString('en-US', {
                    year: 'numeric', month: 'short', day: 'numeric'
                });
            }
        });
    </script>
    <script src="../js/chatbot.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Orders</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #f0f4f8;
            --bg-card: #ffffff;
            --text-primary: #0a1628;
            --text-secondary: #4a5568;
            --text-light: #718096;
            --border: rgba(0, 0, 0, 0.06);
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 30px 80px rgba(0, 0, 0, 0.15);
            --gradient-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --accent: #667eea;
            --radius-sm: 16px;
            --transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        body.dark-mode {
            --bg-primary: #0a0e1a;
            --bg-card: #1a2335;
            --text-primary: #e2e8f0;
            --text-secondary: #a0aec0;
            --text-light: #718096;
            --border: rgba(255, 255, 255, 0.06);
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            --shadow-hover: 0 30px 80px rgba(0, 0, 0, 0.6);
        }

        .page-wrapper { display: flex; min-height: 100vh; }

        .sidebar {
            width: 260px;
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0; left: 0; bottom: 0;
            z-index: 1000;
            transition: transform 0.3s ease;
            overflow-y: auto;
        }

        .sidebar-header {
            padding: 24px 20px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-header .logo {
            font-size: 1.4rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-primary);
        }

        .sidebar-header .logo i { color: var(--accent); font-size: 1.6rem; }

        .sidebar-header .logo .logo-highlight {
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .sidebar-header .admin-badge {
            font-size: 0.7rem;
            color: var(--text-light);
            margin-top: 4px;
            display: block;
        }

        .sidebar-nav { flex: 1; padding: 16px 12px; }
        .sidebar-nav ul { list-style: none; }
        .sidebar-nav ul li { margin-bottom: 4px; }

        .sidebar-nav ul li a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 12px;
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .sidebar-nav ul li a i { width: 20px; font-size: 1.1rem; }

        .sidebar-nav ul li a:hover {
            background: rgba(102, 126, 234, 0.08);
            color: var(--accent);
        }

        .sidebar-nav ul li a.active {
            background: var(--gradient-primary);
            color: white;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        }

        .sidebar-divider {
            border-top: 1px solid var(--border);
            margin: 12px 0;
            padding-top: 12px;
        }

        .sidebar-footer {
            padding: 16px 20px;
            border-top: 1px solid var(--border);
        }

        .theme-btn-sidebar {
            width: 100%;
            padding: 10px 16px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        .theme-btn-sidebar:hover {
            background: rgba(102, 126, 234, 0.08);
            color: var(--accent);
        }

        .main-area {
            flex: 1;
            margin-left: 260px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .main-content { flex: 1; padding: 30px 30px 20px; }
        .container { max-width: 1100px; margin: 0 auto; }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 30px;
        }

        .page-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .page-title i { color: var(--accent); }

        /* ===== TOOLBAR ===== */
        .toolbar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 10px 14px 10px 40px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            background: var(--bg-card);
            color: var(--text-primary);
            outline: none;
            transition: 0.3s;
        }

        .search-box input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.06);
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
        }

        .filter-select {
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            background: var(--bg-card);
            color: var(--text-primary);
            outline: none;
            cursor: pointer;
            min-width: 140px;
        }

        /* ===== TABLE ===== */
        .table-container {
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            padding: 24px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            overflow-x: auto;
        }

        .table-container table {
            width: 100%;
            border-collapse: collapse;
        }

        .table-container th {
            text-align: left;
            padding: 12px 16px;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid var(--border);
        }

        .table-container td {
            padding: 14px 16px;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border);
        }

        .table-container tr:hover { background: rgba(102, 126, 234, 0.02); }

        .order-id {
            color: var(--text-primary);
            font-weight: 600;
            font-family: monospace;
        }

        .status-badge {
            padding: 4px 14px;
            border-radius: 60px;
            font-size: 0.7rem;
            font-weight: 700;
            display: inline-block;
        }

        .status-completed { background: #d1fae5; color: #065f46; }
        .status-progress { background: #dbeafe; color: #1e40af; }
        .status-pending { background: #fef3c7; color: #b45309; }
        .status-cancelled { background: #fee2e2; color: #991b1b; }
        .status-examination { background: #e0e7ff; color: #3730a3; }
        .status-offer { background: #fce7f3; color: #be185d; }

        .action-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Inter', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .action-btn.view {
            background: rgba(102, 126, 234, 0.1);
            color: #667eea;
        }

        .action-btn.view:hover { background: #667eea; color: white; }

        .action-btn.delete {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
        }

        .action-btn.delete:hover { background: #ef4444; color: white; }

        /* ===== PAGINATION ===== */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        .pagination button {
            padding: 8px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-card);
            color: var(--text-secondary);
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .pagination button:hover:not(:disabled) {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .pagination button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .pagination button.active {
            background: var(--gradient-primary);
            color: white;
            border-color: transparent;
        }

        .pagination-info {
            color: var(--text-light);
            font-size: 0.85rem;
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-light);
        }

        .empty-state i { font-size: 3rem; margin-bottom: 16px; opacity: 0.5; }
        .empty-state h3 { color: var(--text-primary); margin-bottom: 8px; font-size: 1.1rem; }

        /* ===== SKELETON ===== */
        .skeleton {
            background: linear-gradient(90deg, var(--border) 25%, rgba(102,126,234,0.1) 50%, var(--border) 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s infinite;
            border-radius: 6px;
        }

        .skeleton-row td { padding: 16px; }
        .skeleton-text { height: 14px; margin: 4px 0; }

        @keyframes skeleton-loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* ===== SIDEBAR TOGGLE ===== */
        .sidebar-toggle {
            display: none;
            position: fixed;
            top: 16px; left: 16px;
            z-index: 1001;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 1.2rem;
            color: var(--text-primary);
            cursor: pointer;
            box-shadow: var(--shadow);
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 999;
        }

        /* ===== FOOTER ===== */
        .footer {
            background: #0f1724 !important;
            color: rgba(255, 255, 255, 0.6) !important;
            border-top: 1px solid rgba(255, 255, 255, 0.06) !important;
            text-align: center;
            padding: 20px;
        }

        .footer p { margin: 4px 0; font-weight: 400; font-size: 0.9rem; color: rgba(255,255,255,0.5) !important; }
        .footer strong { color: white !important; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); width: 280px; }
            .sidebar.open { transform: translateX(0); }
            .sidebar-overlay.open { display: block; }
            .sidebar-toggle { display: block; }
            .main-area { margin-left: 0; padding-top: 60px; }
            .main-content { padding: 20px 16px; }
            .page-title { font-size: 1.4rem; }
            .toolbar { flex-direction: column; }
            .search-box { min-width: 100%; }
        }

        @media (max-width: 480px) {
            .table-container { padding: 16px; }
            .table-container th, .table-container td { padding: 10px 12px; font-size: 0.8rem; }
            .action-btn { padding: 4px 8px; font-size: 0.75rem; }
        }
    </style>
<base target="_blank">
</head>
<body>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <div class="page-wrapper">
        <aside class="sidebar" id="sidebar">

                <div class="logo">
                    <i class="fas fa-wrench"></i>
                    <span>Fix<span class="logo-highlight">ora</span></span>
                </div>
                <span class="admin-badge"><i class="fas fa-shield-halved"></i> Admin Panel</span>

        <div class="main-area">

                        </h1>
                    </div>

                    <!-- Toolbar -->
                    <div class="toolbar">

                            <i class="fas fa-search"></i>
                            <input type="text" id="searchInput" placeholder="Search by customer or service..." />

                        <select class="filter-select" id="statusFilter">
                            <option value="">All Status</option>

                    <div class="table-container">

                            <span class="pagination-info" id="pageInfo">Page 1 of 1</span>

            <footer class="footer">

    <script src="../js/config.js"></script>
    <script src="../js/tokenManager.js"></script>
    <script src="../js/loading.js"></script>
    <script src="../js/errorHandler.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/signalr.js"></script>
    <script src="../js/admin-utils.js"></script>
    <script>
        // ==========================================
        // STATE
        // ==========================================
        let categoriesMap = {};
        let allOrders = [];
        let filteredOrders = [];
        let currentPage = 1;
        const pageSize = 10;

        // ==========================================
        // INIT
        // ==========================================
        document.addEventListener('DOMContentLoaded', async function() {
            if (!Auth.checkAuth(['Admin'])) return;

            await loadCategories();
            await loadOrders();

            document.getElementById('searchInput').addEventListener('input', debounce(() => {
                currentPage = 1;
                applyFilters();
            }, 300));

            document.getElementById('statusFilter').addEventListener('change', () => {
                currentPage = 1;
                applyFilters();
            });
        });

        // ==========================================
        // TIMEOUT HELPER
        // ==========================================
        // ⚠️ باج: الدالة دي كانت معرّفة بـ const جوه loadOrders() بس،
        //    فكانت محلية عليها. و loadCategories() بتناديها كمان:
        //        Promise.race([api.get('categories'), timeout(5000)])
        //    → "ReferenceError: timeout is not defined"
        //    → التصنيفات مابتتحمّلش خالص
        //    → عمود Service بيقول "Unknown" لكل الطلبات.
        function timeout(ms) {
            return new Promise(function (_, reject) {
                setTimeout(function () { reject(new Error('Timeout')); }, ms);
            });
        }

        // ==========================================
        // LOAD CATEGORIES
        // ==========================================
        async function loadCategories() {
            try {
                const list = await Promise.race([api.get('categories'), timeout(5000)]);
                (list || []).forEach(cat => {
                    categoriesMap[cat.id] = cat.name;
                });
            } catch (err) {
                console.error("Failed to load categories:", err);
            }
        }

        // ==========================================
        // LOAD ORDERS
        // ==========================================
        async function loadOrders() {
            try {
                const list = await Promise.race([api.get('service-requests'), timeout(8000)]);
                allOrders = list || [];

                // ✅ ServiceRequestDto مفيهوش customerName ولا providerName —
                //    فيه customerId و selectedProviderId (GUIDs) بس.
                //    لازم نجيب الأسماء من /Profile/{userId}.
                await loadUserNames(allOrders);

                applyFilters();
            } catch (err) {
                console.error("Failed to load orders:", err);
                document.getElementById('ordersTableBody').innerHTML = `
                    <tr><td colspan="7" class="empty-state">
                        <i class="fas fa-circle-exclamation"></i>
                        <h3>Failed to load orders</h3>
                        <p>Please try again later</p>
                    </td></tr>
                `;
            }
        }

        // ==========================================
        // أسماء المستخدمين الحقيقية
        // ==========================================
        // ⚠️ الكود كان بيقرا order.customerName و order.providerName —
        //    والحقلين دول مش موجودين في أي DTO في المشروع كله.
        //    فكان عمود Customer بيعرض GUID خام، وعمود Provider بيقول
        //    "Not Assigned" دايمًا حتى لما يكون فيه فني متعيّن،
        //    والبحث بالاسم مكانش شغال خالص (بيدوّر في undefined).
        var userNames = {};   // userId → الاسم الحقيقي

        async function loadUserNames(orders) {
            var ids = [];
            (orders || []).forEach(function (o) {
                [o.customerId, o.selectedProviderId].forEach(function (id) {
                    if (id && !userNames[id] && ids.indexOf(id) === -1) ids.push(id);
                });
            });
            if (!ids.length) return;

            await Promise.all(ids.map(async function (id) {
                try {
                    var p = await api.get('Profile/' + id, { showLoader: false, silent: true });
                    if (p && p.fullName) userNames[id] = p.fullName;
                } catch (e) { /* البروفايل مش متاح */ }
            }));
        }

        // ==========================================
        // FILTER & PAGINATE
        // ==========================================
        function applyFilters() {
            const search = document.getElementById('searchInput').value.toLowerCase().trim();
            const status = document.getElementById('statusFilter').value;

            filteredOrders = allOrders.filter(order => {
                const matchesSearch = !search || 
                    (userNames[order.customerId] || '').toLowerCase().includes(search) ||
                    (userNames[order.selectedProviderId] || '').toLowerCase().includes(search) ||
                    (categoriesMap[order.categoryId] || '').toLowerCase().includes(search) ||
                    order.id.toLowerCase().includes(search);

                const matchesStatus = !status || order.status === status;

                return matchesSearch && matchesStatus;
            });

            renderTable();
            renderPagination();
        }

        function renderTable() {
            const tbody = document.getElementById('ordersTableBody');

            if (filteredOrders.length === 0) {
                tbody.innerHTML = `
                    <tr><td colspan="7" class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <h3>No orders found</h3>
                        <p>Try adjusting your search or filters</p>
                    </td></tr>
                `;
                return;
            }

            const start = (currentPage - 1) * pageSize;
            const pageItems = filteredOrders.slice(start, start + pageSize);

            tbody.innerHTML = pageItems.map(order => {
                const shortId = `#${order.id.substring(0, 8)}`;
                const categoryName = categoriesMap[order.categoryId] || 'Unknown';
                const createdDate = order.createdAt 
                    ? new Date(order.createdAt).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' })
                    : 'N/A';

                let badgeClass = 'status-pending';
                let statusLabel = order.status || 'Pending';

                switch(order.status) {
                    case 'Completed': badgeClass = 'status-completed'; break;
                    case 'ExecutionStarted': badgeClass = 'status-progress'; statusLabel = 'In Progress'; break;
                    case 'Examination': badgeClass = 'status-examination'; break;
                    case 'OfferPhase': badgeClass = 'status-offer'; break;
                    case 'Cancelled': badgeClass = 'status-cancelled'; break;
                }

                return `
                    <tr>
                        <td class="order-id">${shortId}</td>
                        <td>${userNames[order.customerId] || 'Customer #' + (order.customerId || '').substring(0, 5).toUpperCase()}</td>
                        <td>${categoryName}</td>
                        <td>${order.selectedProviderId ? (userNames[order.selectedProviderId] || 'Provider #' + order.selectedProviderId.substring(0, 5).toUpperCase()) : 'Not Assigned'}</td>
                        <td><span class="status-badge ${badgeClass}">${statusLabel}</span></td>
                        <td>${createdDate}</td>
                        <td>
                            <div style="display:flex;gap:6px;flex-wrap:wrap;">
                                <button class="action-btn view" onclick="viewOrder('${order.id}')" title="View Details">
                                    <i class="fas fa-eye"></i>
                                </button>
                                <button class="action-btn delete" onclick="deleteOrder('${order.id}')" title="Cancel/Delete">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function renderPagination() {
            const totalPages = Math.ceil(filteredOrders.length / pageSize) || 1;
            document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages} (${filteredOrders.length} total)`;
            document.getElementById('prevBtn').disabled = currentPage <= 1;
            document.getElementById('nextBtn').disabled = currentPage >= totalPages;
        }

        function changePage(delta) {
            const totalPages = Math.ceil(filteredOrders.length / pageSize) || 1;
            const newPage = currentPage + delta;
            if (newPage >= 1 && newPage <= totalPages) {
                currentPage = newPage;
                renderTable();
                renderPagination();
            }
        }

        // ==========================================
        // ORDER ACTIONS
        // ==========================================
        function viewOrder(orderId) {
            window.location.href = `order-details.html?id=${orderId}`;
        }

        async function deleteOrder(orderId) {
            if (!confirm(`⚠️ Cancel/delete order #${orderId.substring(0, 8)}?`)) return;

            try {
                await api.delete(`service-requests/${orderId}`);
                ErrorHandler.showNotification("Success", "Order cancelled successfully.", "success");
                await loadOrders();
            } catch (err) {
                console.error("Failed to delete order:", err);
            }
        }

        // ==========================================
        // UTILS
        // ==========================================
        function debounce(fn, delay) {
            let timeout;
            return function(...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => fn.apply(this, args), delay);
            };
        }

        // ==========================================
        // SIDEBAR & THEME
        // ==========================================
        const sidebarToggle = document.getElementById('sidebarToggle');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');

        function toggleSidebar() {
            sidebar.classList.toggle('open');
            sidebarOverlay.classList.toggle('open');
        }

        if (sidebarToggle) sidebarToggle.addEventListener('click', toggleSidebar);
        if (sidebarOverlay) sidebarOverlay.addEventListener('click', toggleSidebar);

        const themeToggle = document.getElementById('themeToggle');
        const body = document.body;

        if (localStorage.getItem('adminTheme') === 'dark') {
            body.classList.add('dark-mode');
            if (themeToggle) themeToggle.innerHTML = '<i class="fas fa-sun"></i> Light Mode';
        }

        if (themeToggle) {
            themeToggle.addEventListener('click', function() {
                body.classList.toggle('dark-mode');
                if (body.classList.contains('dark-mode')) {
                    localStorage.setItem('adminTheme', 'dark');
                    this.innerHTML = '<i class="fas fa-sun"></i> Light Mode';
                } else {
                    localStorage.setItem('adminTheme', 'light');
                    this.innerHTML = '<i class="fas fa-moon"></i> Dark Mode';
                }
            });
        }

            
        function handleLogout(event) {
            event.preventDefault();
            if (typeof Auth !== 'undefined' && Auth.logout) {
                Auth.logout();
            } else {
                if (typeof TokenManager !== 'undefined') TokenManager.clearTokens();
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>

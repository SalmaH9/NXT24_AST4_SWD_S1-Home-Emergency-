<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Fixora</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        /* ==========================================
           RESET
           ========================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
            overflow-y: auto;

            background:
                linear-gradient(rgba(255,255,255,.14), rgba(255,255,255,.14)),
                linear-gradient(rgba(0,0,0,.22), rgba(0,0,0,.22)),
                url("./images/wall.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        /* ==========================================
           CONTAINER - شفاف مع خلفية زاهية
           ========================================== */
        .login-container {
            background: rgba(255, 252, 248, 0.94);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 50px 45px;
            max-width: 440px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.72);
            box-shadow: 0 28px 70px rgba(23, 30, 54, 0.14),
                        0 10px 24px rgba(23, 30, 54, 0.08),
                        inset 0 1px 0 rgba(255, 255, 255, 0.85);
            position: relative;
            z-index: 1;
            animation: slideIn 0.8s ease forwards;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ===== HEADER ===== */
        .login-header {
            text-align: center;
            margin-bottom: 34px;
        }

        .login-header .logo-wrapper {
            width: 72px;
            height: 72px;
            background: rgba(244, 247, 255, 0.92);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            border: 1px solid rgba(214, 223, 246, 0.85);
            box-shadow: 0 12px 28px rgba(32, 46, 88, 0.08);
            animation: logoPulse 3s ease-in-out infinite;
        }

        @keyframes logoPulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.02);
            }
        }

        .login-header .logo-wrapper i {
            font-size: 2.2rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .login-header h1 {
            font-size: 2rem;
            font-weight: 800;
            color: #1a202c;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }

        .login-header p {
            color: rgba(26, 32, 44, 0.62);
            font-size: 0.95rem;
        }

        /* ==========================================
           ADMIN LOGIN STYLES (جديد)
           ========================================== */

        /* Admin Login Link */
        .admin-login-link {
            text-align: center;
            margin-bottom: 16px;
        }

        .admin-login-link a {
            color: rgba(26, 32, 44, 0.3);
            text-decoration: none;
            font-size: 0.8rem;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .admin-login-link a:hover {
            color: #667eea;
            text-decoration: underline;
        }

        /* Admin Login Form */
        .admin-form {
            display: none;
            padding: 16px;
            background: rgba(244, 247, 255, 0.72);
            border-radius: 16px;
            margin-bottom: 16px;
            border: 1px solid rgba(214, 223, 246, 0.78);
        }

        .admin-form.show {
            display: block;
            animation: slideIn 0.4s ease forwards;
        }

        .admin-form .form-group {
            margin-bottom: 12px;
        }

        .admin-form .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.8rem;
            color: rgba(26, 32, 44, 0.6);
            margin-bottom: 4px;
        }

        .admin-form .form-group input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            background: rgba(255, 255, 255, 0.86);
            color: #1a202c;
            transition: 0.3s;
            outline: none;
        }

        .admin-form .form-group input:focus {
            border-color: #667eea;
            background: rgba(255, 255, 255, 0.98);
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.04);
        }

        .admin-form .form-group input::placeholder {
            color: rgba(26, 32, 44, 0.2);
        }

        /* Admin Login Button */
        .btn-admin-login {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-admin-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(102, 126, 234, 0.2);
        }

        /* ==========================================
           FORM
           ========================================== */
        .login-form {
            position: relative;
        }

        /* Role Selector */
        .role-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 28px;
        }

        .role-option {
            padding: 16px 12px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        .role-option:hover {
            border-color: rgba(102, 126, 234, 0.3);
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.35);
        }

        .role-option.active {
            border-color: #667eea;
            background: rgba(255, 255, 255, 0.45);
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.06);
        }

        .role-option i {
            font-size: 2rem;
            display: block;
            margin-bottom: 6px;
            color: rgba(26, 32, 44, 0.25);
            transition: 0.3s;
        }

        .role-option.active i {
            color: #667eea;
        }

        .role-option .role-title {
            font-weight: 700;
            font-size: 1rem;
            color: #1a202c;
            display: block;
        }

        .role-option .role-desc {
            font-size: 0.7rem;
            font-weight: 500;
            color: rgba(26, 32, 44, 0.35);
            display: block;
            margin-top: 2px;
        }

        .role-option.active .role-desc {
            color: #667eea;
        }

        .role-option input[type="radio"] {
            display: none;
        }

        /* Form Groups */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            color: rgba(26, 32, 44, 0.6);
            margin-bottom: 6px;
        }

        .form-group .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .form-group .input-wrapper .input-icon {
            position: absolute;
            left: 16px;
            color: rgba(26, 32, 44, 0.25);
            font-size: 1rem;
            transition: 0.3s;
            pointer-events: none;
        }

        .form-group .input-wrapper input {
            width: 100%;
            padding: 16px 16px 16px 48px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 16px;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            color: #1a202c;
            transition: 0.3s;
            outline: none;
        }

        .form-group .input-wrapper input::placeholder {
            color: rgba(26, 32, 44, 0.2);
        }

        .form-group .input-wrapper input:focus {
            border-color: #667eea;
            background: rgba(255, 255, 255, 0.35);
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.04);
        }

        .form-group .input-wrapper input:focus ~ .input-icon {
            color: #667eea;
        }

        .password-toggle {
            position: absolute;
            right: 16px;
            background: none;
            border: none;
            color: rgba(26, 32, 44, 0.25);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 8px;
            transition: 0.3s;
            border-radius: 8px;
        }

        .password-toggle:hover {
            color: #667eea;
            background: rgba(255, 255, 255, 0.1);
        }

        /* Form Options */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 26px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .form-options label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: rgba(26, 32, 44, 0.5);
            cursor: pointer;
        }

        .form-options label input[type="checkbox"] {
            accent-color: #667eea;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .form-options a {
            color: #667eea;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            transition: 0.3s;
        }

        .form-options a:hover {
            color: #5a67d8;
            text-decoration: underline;
        }

        /* Login Button */
        .btn-login {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            position: relative;
            overflow: hidden;
        }

        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(102, 126, 234, 0.2);
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        .btn-login::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent 30%,
                rgba(255, 255, 255, 0.15) 50%,
                transparent 70%
            );
            animation: shimmerBtn 4s infinite;
            transform: rotate(45deg);
        }

        @keyframes shimmerBtn {
            0% {
                transform: translateX(-100%) rotate(45deg);
            }
            100% {
                transform: translateX(100%) rotate(45deg);
            }
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 22px 0 24px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.4);
        }

        .divider span {
            color: rgba(26, 32, 44, 0.25);
            font-size: 0.8rem;
            font-weight: 500;
            white-space: nowrap;
        }

        /* Social Login */
        .social-login {
            display: flex;
            gap: 14px;
            justify-content: center;
        }

        .social-login a {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(26, 32, 44, 0.25);
            transition: all 0.3s ease;
            font-size: 1.2rem;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        .social-login a:hover {
            border-color: #667eea;
            color: #667eea;
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.3);
        }

        /* Footer */
        .login-footer {
            text-align: center;
            margin-top: 26px;
        }

        .login-footer p {
            color: rgba(26, 32, 44, 0.35);
            font-size: 0.9rem;
        }

        .login-footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: 700;
            transition: 0.3s;
        }

        .login-footer a:hover {
            color: #5a67d8;
            text-decoration: underline;
        }

        /* Error Message */
        .error-message {
            background: rgba(229, 62, 62, 0.06);
            color: #e53e3e;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.9rem;
            margin-bottom: 18px;
            display: none;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(229, 62, 62, 0.08);
            backdrop-filter: blur(5px);
        }

        .error-message.show {
            display: flex;
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-8px);
            }
            75% {
                transform: translateX(8px);
            }
        }

        /* ==========================================
           RESPONSIVE
           ========================================== */
        @media (max-width: 480px) {
            .login-container {
                padding: 32px 24px;
                border-radius: 24px;
            }
            .login-header h1 {
                font-size: 1.6rem;
            }
            .login-header .logo-wrapper {
                width: 60px;
                height: 60px;
            }
            .login-header .logo-wrapper i {
                font-size: 1.8rem;
            }
            .role-selector {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            .role-option {
                padding: 12px 8px;
            }
            .role-option i {
                font-size: 1.6rem;
            }
            .form-options {
                flex-direction: column;
                align-items: flex-start;
            }
        }

</style>
</head>
<body>
    <!-- ===== CONTAINER ===== -->
    <div class="login-container">

        <!-- Header -->
        <div class="login-header">
            <div class="logo-wrapper">
                <i class="fas fa-wrench"></i>
            </div>
            <h1>Welcome Back</h1>
            <p>Sign in to manage your repairs</p>
        </div>

        <!-- ========================================== -->
        <!-- ===== ADMIN LOGIN SECTION (جديد) ===== -->
        <!-- ========================================== -->

        <!-- Login Form -->
        <form class="login-form" id="loginForm" onsubmit="handleLogin(event)">

            <!-- Error Message -->
            <div class="error-message" id="errorMessage">
                <i class="fas fa-circle-exclamation"></i>
                <span id="errorText">Invalid email or password</span>
            </div>

            <!-- Role Selector -->
            <div class="login-tabs">
    <button type="button" class="tab active" id="customerTab">Customer</button>
    <button type="button" class="tab" id="providerTab">Provider</button>
</div>
<input type="hidden" name="role" id="selectedRole" value="customer" />
            <!-- Email -->
            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-wrapper">
                    <input type="email" id="email" placeholder="you@example.com" required />
                    <i class="fas fa-envelope input-icon"></i>
                </div>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="••••••••" required />
                    <i class="fas fa-lock input-icon"></i>
                    <button type="button" class="password-toggle" id="togglePassword">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <!-- Options -->
            <div class="form-options">
                <label>
                    <input type="checkbox" id="rememberMe" checked />
                    Remember me
                </label>
                <a href="#">Forgot password?</a>
            </div>

            <!-- Login Button -->
            <button type="submit" class="btn-login">
                <i class="fas fa-arrow-right-to-bracket"></i> Sign In
            </button>

            <!-- Divider -->
            <div class="divider">
                <span>or continue with</span>
            </div>

            <!-- Social Login -->
            <div class="social-login">
                <a href="#"><i class="fab fa-google"></i></a>
                <a href="#"><i class="fab fa-apple"></i></a>
            </div>
        </form>

<!-- Footer -->
        <div class="login-footer">
            <p>Don't have an account? <a href="register.html">Sign Up</a></p>
        </div>

<div class="admin-access">
<div class="admin-login-link">
<a href="#" onclick="toggleAdminForm(event)"><i class="fas fa-shield-halved"></i> Admin Login</a>
</div>
<div class="admin-form" id="adminForm">
<div class="form-group"><label>Admin Email</label><input type="email" id="adminEmail" placeholder="you@example.com"></div>
<div class="form-group"><label>Admin Password</label><input type="password" id="adminPassword" placeholder="••••••••"></div>
<button type="button" class="btn-admin-login" onclick="handleAdminLogin()"><i class="fas fa-shield-halved"></i> Admin Sign In</button>
</div>
</div>

    </div>

    <script src="../js/config.js"></script>
    <script src="../js/tokenManager.js"></script>
    <script src="../js/loading.js"></script>
    <script src="../js/errorHandler.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        const customerTab = document.getElementById("customerTab");
        const providerTab = document.getElementById("providerTab");
        const selectedRole = document.getElementById("selectedRole");
        customerTab?.addEventListener("click", () => { customerTab.classList.add("active"); providerTab.classList.remove("active"); selectedRole.value = "customer"; });
        providerTab?.addEventListener("click", () => { providerTab.classList.add("active"); customerTab.classList.remove("active"); selectedRole.value = "provider"; });

        // ==========================================
        // ROLE SELECTOR
        // ==========================================
        const customerRole = document.getElementById('customerRole');
        const providerRole = document.getElementById('providerRole');

        if (customerRole) {
            customerRole.addEventListener('click', function() {
                this.classList.add('active');
                providerRole.classList.remove('active');
                document.querySelector('input[name="role"][value="customer"]').checked = true;
            });
        }

        if (providerRole) {
            providerRole.addEventListener('click', function() {
                this.classList.add('active');
                customerRole.classList.remove('active');
                document.querySelector('input[name="role"][value="provider"]').checked = true;
            });
        }

        // ==========================================
        // TOGGLE PASSWORD
        // ==========================================
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        if (togglePassword && passwordInput) {
            togglePassword.addEventListener('click', function() {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                const icon = this.querySelector('i');
                icon.classList.toggle('fa-eye');
                icon.classList.toggle('fa-eye-slash');
            });
        }

        // ==========================================
        // HANDLE LOGIN (العادي)
        // ==========================================
        async function handleLogin(event) {
            event.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            const rememberMe = document.getElementById('rememberMe').checked;
            const role = document.getElementById('selectedRole').value;

            if (email === '' || password === '') {
                errorText.textContent = 'Please fill in all fields';
                errorMessage.classList.add('show');
                return;
            }

            try {
                const response = await api.post('/auth/login', {
                    email: email,
                    password: password
                });

                if (response && response.accessToken) {
                    TokenManager.saveAccessToken(response.accessToken);
                    TokenManager.saveRefreshToken(response.refreshToken);

                    // Fetch user complete profile info
                    const profile = await api.get('/profile');

                    if (profile) {
                        const profileRole = profile.role.toLowerCase();
                        TokenManager.setUserRole(profileRole);
                        TokenManager.setUserEmail(profile.email);
                        localStorage.setItem('userName', profile.fullName);
                        if (profile.phoneNumber) {
                            localStorage.setItem('userPhone', profile.phoneNumber);
                        }

                        if (rememberMe && profileRole !== 'admin') {
                            localStorage.setItem('rememberMe', 'true');
                        } else {
                            localStorage.removeItem('rememberMe');
                        }

                        const accountStatus = profile.status; // 'Active', 'Pending', 'Suspended', 'Inactive'

                        if (accountStatus === 'Suspended') {
                            throw new Error('Your account has been suspended. Please contact support.');
                        }
                        if (accountStatus === 'Inactive') {
                            throw new Error('Your account is currently inactive.');
                        }

                        errorMessage.classList.remove('show');

                        if (profileRole === 'admin') {
                            window.location.href = 'admin-dashboard.html';
                        } else if (profileRole === 'customer') {
                            window.location.href = 'customer-dashboard.html';
                        } else if (profileRole === 'provider' || profileRole === 'company') {
                            const isPending = (accountStatus === 'Pending');
                            if (isPending) {
                                localStorage.setItem('providerVerified', 'pending');
                                localStorage.setItem('providerStatus', 'under_review');
                                window.location.href = 'provider-verification.html';
                            } else {
                                localStorage.setItem('providerVerified', 'approved');
                                localStorage.setItem('providerStatus', 'approved');
                                
                                try {
                                    const sub = await api.get('/subscriptions/my-subscription', { showLoader: false });
                                    if (sub && sub.status === 'Active') {
                                        localStorage.setItem('fixoraSubscription', JSON.stringify({ plan: sub.planName.toLowerCase(), expiresAt: sub.endDate }));
                                        localStorage.setItem('providerActive', 'true');
                                        window.location.href = 'provider-dashboard.html';
                                    } else {
                                        localStorage.setItem('providerActive', 'false');
                                        window.location.href = 'subscription.html';
                                    }
                                } catch (subErr) {
                                    localStorage.setItem('providerActive', 'false');
                                    window.location.href = 'subscription.html';
                                }
                            }
                        }
                    }
                }
            } catch (error) {
                console.error('Login failed:', error);
                if (error instanceof Error) {
                    errorText.textContent = error.message;
                } else {
                    errorText.textContent = 'Invalid credentials or connection error.';
                }
                errorMessage.classList.add('show');
                TokenManager.clearTokens();
            }
        }

        // ==========================================
        // REAL-TIME VALIDATION
        // ==========================================
        document.querySelectorAll('#loginForm input').forEach(input => {
            input.addEventListener('input', () => {
                const errorMessage = document.getElementById('errorMessage');
                if (errorMessage) errorMessage.classList.remove('show');
            });
        });

        // ==========================================
        // AUTO-FILL REMEMBERED EMAIL
        // ==========================================
        window.addEventListener('DOMContentLoaded', function() {
            if (localStorage.getItem('rememberMe') === 'true') {
                const email = localStorage.getItem('userEmail');
                if (email && email !== 'admin@fixora.com') {
                    const emailInput = document.getElementById('email');
                    const rememberMeInput = document.getElementById('rememberMe');
                    if (emailInput) emailInput.value = email;
                    if (rememberMeInput) rememberMeInput.checked = true;
                }
            }
        });

        // ==========================================
        // ADMIN LOGIN FUNCTIONS
        // ==========================================

        function toggleAdminForm(event) {
            event.preventDefault();
            document.getElementById('adminForm').classList.toggle('show');
        }

        async function handleAdminLogin() {
            const email = document.getElementById('adminEmail').value.trim();
            const password = document.getElementById('adminPassword').value;

            if (email === '' || password === '') {
                ErrorHandler.showNotification('Validation Error', 'Please enter email and password', 'error');
                return;
            }

            try {
                const response = await api.post('/auth/login', {
                    email: email,
                    password: password
                });

                if (response && response.accessToken) {
                    TokenManager.saveAccessToken(response.accessToken);
                    TokenManager.saveRefreshToken(response.refreshToken);

                    const profile = await api.get('/profile');
                    if (profile) {
                        const profileRole = profile.role.toLowerCase();
                        if (profileRole !== 'admin') {
                            throw new Error('Unauthorized. You are not an administrator.');
                        }

                        TokenManager.setUserRole('admin');
                        TokenManager.setUserEmail(profile.email);
                        localStorage.setItem('userName', profile.fullName);
                        localStorage.removeItem('rememberMe');

                        window.location.href = 'admin-dashboard.html';
                    }
                }
            } catch (error) {
                console.error('Admin login failed:', error);
                const msg = error.message || 'Admin login failed.';
                ErrorHandler.showNotification('Access Denied', msg, 'error');
                TokenManager.clearTokens();
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            const adminPassword = document.getElementById('adminPassword');
            if (adminPassword) {
                adminPassword.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        handleAdminLogin();
                    }
                });
            }
        });
</script>

</body>
</html>

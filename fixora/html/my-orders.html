<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Orders - Fixora</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        .order-card {
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            padding: 20px 24px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            margin-bottom: 16px;
            transition: var(--transition);
        }

        .order-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .order-header .order-id {
            font-weight: 700;
            color: var(--text-primary);
            font-size: 1.05rem;
        }

        .order-header .order-date {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .order-body {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 10px;
        }

        .order-body .service-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .order-body .service-info i {
            font-size: 1.4rem;
            color: var(--accent);
        }

        .order-body .service-info .service-name {
            font-weight: 600;
            color: var(--text-primary);
        }

        .order-body .service-info .service-location {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .order-status-badge {
            padding: 4px 16px;
            border-radius: 60px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .status-pending {
            background: #fef3c7;
            color: #b45309;
        }
        .status-selected {
            background: #dbeafe;
            color: #1e40af;
        }
        .status-examined {
            background: #e0e7ff;
            color: #4338ca;
        }
        .status-progress {
            background: #dbeafe;
            color: #1e40af;
        }
        .status-accepted {
            background: #d1fae5;
            color: #065f46;
        }
        .status-completed {
            background: #d1fae5;
            color: #065f46;
        }
        .status-cancelled {
            background: #fee2e2;
            color: #991b1b;
        }

        .order-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-sm {
            padding: 6px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.8rem;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Inter', sans-serif;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-outline {
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-outline:hover {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .btn-track {
            background: var(--gradient-primary);
            color: white;
        }

        .btn-track:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.35);
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-review {
            background: #f6ad55;
            color: white;
        }

        .btn-review:hover {
            background: #ed8936;
        }

        .filter-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .filter-tab {
            padding: 8px 20px;
            border: 2px solid var(--border);
            border-radius: 60px;
            background: var(--bg-primary);
            color: var(--text-secondary);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: var(--transition);
            font-family: 'Inter', sans-serif;
        }

        .filter-tab:hover,
        .filter-tab.active {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(102, 126, 234, 0.08);
        }

        .filter-tab.active {
            background: var(--accent);
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-light);
        }

        .empty-state i {
            font-size: 3rem;
            color: var(--border);
            margin-bottom: 16px;
        }
        
    </style>
</head>
<body>
    <!-- Mobile Toggle -->
    <button class="sidebar-toggle" id="sidebar-toggle">
        <i class="fas fa-bars"></i>
    </button>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <div class="page-wrapper">
        <!-- SIDEBAR -->
          <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fas fa-wrench"></i>
                    <span>Fix<span class="logo-highlight">ora</span></span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="customer-dashboard.html"><i class="fas fa-gauge-high"></i> Dashboard</a></li>
                    <li><a href="post-request.html"><i class="fas fa-plus-circle"></i> Post Request</a></li>
                    <li><a href="my-orders.html" class="active"><i class="fas fa-list-check"></i> My Orders</a></li>
                    <li><a href="customer-profile.html"><i class="fas fa-user"></i> Profile</a></li>
                    <li style="margin-top: 16px; border-top: 1px solid var(--border); padding-top: 12px;">
                        <a href="index.html" onclick="handleLogout(event)" style="color: #ef4444; font-weight: 600;">
                            <i class="fas fa-sign-out-alt" style="margin-right: 10px;"></i> Logout
                        </a>
                    </li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <button id="theme-toggle" class="theme-btn-sidebar">
                    <i class="fas fa-moon"></i> Dark Mode
                </button>
            </div>
        </aside>

        <!-- MAIN -->
        <div class="main-area">

            <main class="main-content">
                <div class="container">
                    <h1 class="page-title">
                        <i class="fas fa-clock-rotate-left"></i> My Orders
                    </h1>

                    <!-- Filter Tabs -->
                    <div class="filter-tabs">
                        <button class="filter-tab active" data-filter="all">All</button>
                        <button class="filter-tab" data-filter="pending">Pending</button>
                        <button class="filter-tab" data-filter="selected">Selected</button>
                        <button class="filter-tab" data-filter="examined">Examined</button>
                        <button class="filter-tab" data-filter="in-progress">In Progress</button>
                        <button class="filter-tab" data-filter="completed">Completed</button>
                    </div>

                    <!-- Orders List -->
                    <div id="ordersContainer">
                        <!-- Rendered by JavaScript -->
                    </div>

                </div>
            </main>

            <footer class="footer">
                <p>© 2026 <strong>Fixora</strong> — Professional Home Repair Services</p>
                <p class="footer-update">Last updated: <span id="footer-date"></span></p>
            </footer>
        </div>
    </div>

    <script src="../js/script.js"></script>
    <script>
        // ===== ORDERS DATA =====
        var ordersData = [
            { 
                id: '#ORD-001', 
                service: 'Plumbing', 
                status: 'selected', 
                date: '2026-07-08', 
                address: 'Al-Malaz, Riyadh', 
                price: '$50',
                technician: 'Ahmed Al-Rashid',
                category: 'plumbing',
                description: 'Kitchen sink leaking from pipe under counter...'
            },
            { 
                id: '#ORD-002', 
                service: 'AC Repair', 
                status: 'completed', 
                date: '2026-07-06', 
                address: 'Al-Narjis, Riyadh', 
                price: '$80',
                technician: 'Khalid Al-Otaibi',
                category: 'ac-repair',
                description: 'AC not cooling properly'
            },
            { 
                id: '#ORD-003', 
                service: 'Electrical', 
                status: 'examined', 
                date: '2026-07-09', 
                address: 'Al-Sulaimaniyah, Riyadh', 
                price: '$60',
                technician: 'Faisal Al-Harbi',
                category: 'electrical',
                description: 'Power outlet not working'
            },
            { 
                id: '#ORD-004', 
                service: 'Carpentry', 
                status: 'pending', 
                date: '2026-07-10', 
                address: 'Al-Rawdah, Riyadh', 
                price: '$45',
                technician: null,
                category: 'carpentry',
                description: 'Broken cabinet door'
            },
            { 
                id: '#ORD-005', 
                service: 'Painting', 
                status: 'in-progress', 
                date: '2026-07-08', 
                address: 'Al-Mughrizat, Riyadh', 
                price: '$40',
                technician: 'Sami Al-Qahtani',
                category: 'painting',
                description: 'Wall painting needed'
            },
            { 
                id: '#ORD-006', 
                service: 'Plumbing', 
                status: 'completed', 
                date: '2026-07-04', 
                address: 'Al-Malaz, Riyadh', 
                price: '$50',
                technician: 'Nasser Al-Dosari',
                category: 'plumbing',
                description: 'Pipe replacement'
            }
        ];

        var currentFilter = 'all';

        // ==========================================
        // ✅ VIEW EXAMINATION - Save request data
        // ==========================================
        function viewExamination(order) {
            // Create request object from order data
            var requestData = {
                id: order.id.replace('#', ''),
                category: order.category || 'plumbing',
                description: order.description || 'Service request',
                city: order.address || 'Cairo',
                customerEmail: localStorage.getItem('userEmail') || 'customer@fixora.com',
                status: order.status,
                selectedTechnician: order.technician,
                createdAt: order.date,
                examinations: order.examinations || []
            };

            // Save to localStorage
            localStorage.setItem('currentRequest', JSON.stringify(requestData));
            
            // Redirect to examination page
            window.location.href = 'examination.html';
        }

        // ==========================================
        // ✅ REVIEW REPORT - Save request data
        // ==========================================
        function reviewReport(order) {
            // Create request object from order data
            var requestData = {
                id: order.id.replace('#', ''),
                category: order.category || 'plumbing',
                description: order.description || 'Service request',
                city: order.address || 'Cairo',
                customerEmail: localStorage.getItem('userEmail') || 'customer@fixora.com',
                status: 'examined',
                selectedTechnician: order.technician,
                createdAt: order.date,
                examinations: order.examinations || [
                    {
                        id: 'EXAM_' + Date.now(),
                        techId: 'TECH_001',
                        techName: order.technician || 'Technician',
                        techRating: '4.8',
                        techExp: '5 years',
                        diagnosis: 'The main water pipe under the kitchen sink has a 2cm crack due to corrosion.',
                        solution: 'Replace the cracked PVC pipe section with new piping.',
                        materials: 'PVC pipe, Rubber gasket, Pipe sealant',
                        price: 220,
                        estTime: '1-2 hours',
                        status: 'pending',
                        date: 'Today'
                    }
                ]
            };

            // Save to localStorage
            localStorage.setItem('currentRequest', JSON.stringify(requestData));
            
            // Redirect to examination page
            window.location.href = 'examination.html';
        }

        // ===== RENDER ORDERS =====
        function renderOrders(filter) {
            filter = filter || 'all';
            var container = document.getElementById('ordersContainer');
            var filtered = filter === 'all' ? ordersData : ordersData.filter(function(o) { return o.status === filter; });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <p style="font-weight: 600; color: var(--text-secondary);">No orders found</p>
                        <a href="post-request.html" class="btn-primary" style="display: inline-flex; margin-top: 12px;">
                            <i class="fas fa-plus"></i> Post a Request
                        </a>
                    </div>
                `;
                return;
            }

            var html = '';
            filtered.forEach(function(order) {
                var statusClass = {
                    'pending': 'status-pending',
                    'selected': 'status-selected',
                    'examined': 'status-examined',
                    'in-progress': 'status-progress',
                    'accepted': 'status-accepted',
                    'completed': 'status-completed',
                    'cancelled': 'status-cancelled'
                }[order.status] || 'status-pending';

                var statusLabels = {
                    'pending': '⏳ Pending',
                    'selected': '👷 Technician Selected',
                    'examined': '📋 Examination Ready',
                    'in-progress': '🔧 In Progress',
                    'accepted': '✅ Accepted',
                    'completed': '✅ Completed',
                    'cancelled': '❌ Cancelled'
                };

                var icon = {
                    'Plumbing': 'fa-faucet',
                    'Electrical': 'fa-bolt',
                    'AC Repair': 'fa-snowflake',
                    'Carpentry': 'fa-hammer',
                    'Painting': 'fa-paint-roller',
                    'Masonry': 'fa-trowel',
                    'Cleaning': 'fa-broom',
                    'Gardening': 'fa-leaf'
                }[order.service] || 'fa-wrench';

                // بناء الأزرار حسب الحالة
                var actionsHtml = '';

                // زر التفاصيل موجود دائماً
                actionsHtml += `
                    <a href="order-details.html?id=${order.id}" class="btn-sm btn-outline">
                        <i class="fas fa-eye"></i> Details
                    </a>
                `;

                // ✅ حالة selected → عرض زر "View Examination"
                if (order.status === 'selected') {
                    actionsHtml += `
                        <button class="btn-sm btn-review" onclick="viewExamination(${JSON.stringify(order).replace(/"/g, '&quot;')})">
                            <i class="fas fa-file-medical"></i> View Examination
                        </button>
                    `;
                }

                // ✅ حالة examined → عرض زر "Review Report"
                if (order.status === 'examined') {
                    actionsHtml += `
                        <button class="btn-sm btn-review" onclick="reviewReport(${JSON.stringify(order).replace(/"/g, '&quot;')})">
                            <i class="fas fa-file-contract"></i> Review Report
                        </button>
                    `;
                }

                // حالة in-progress → عرض زر "Track"
                if (order.status === 'in-progress' || order.status === 'accepted') {
                    actionsHtml += `
                        <a href="execution.html" class="btn-sm btn-track">
                            <i class="fas fa-location-dot"></i> Track
                        </a>
                    `;
                }

                // حالة completed → عرض زر "Rate"
                if (order.status === 'completed') {
                    actionsHtml += `
                        <a href="rating.html" class="btn-sm btn-review">
                            <i class="fas fa-star"></i> Rate
                        </a>
                    `;
                }

                // زر الإلغاء للطلبات الغير منتهية
                if (order.status !== 'completed' && order.status !== 'cancelled') {
                    actionsHtml += `
                        <button class="btn-sm btn-danger" onclick="cancelOrder('${order.id}')">
                            <i class="fas fa-xmark"></i> Cancel
                        </button>
                    `;
                }

                html += `
                    <div class="order-card">
                        <div class="order-header">
                            <span class="order-id">${order.id}</span>
                            <span class="order-date"><i class="far fa-calendar"></i> ${order.date}</span>
                        </div>
                        <div class="order-body">
                            <div class="service-info">
                                <i class="fas ${icon}"></i>
                                <div>
                                    <div class="service-name">${order.service}</div>
                                    <div class="service-location"><i class="fas fa-location-dot" style="font-size: 0.7rem;"></i> ${order.address}</div>
                                    ${order.technician ? `<div style="font-size: 0.8rem; color: var(--text-secondary);"><i class="fas fa-user"></i> ${order.technician}</div>` : ''}
                                </div>
                            </div>
                            <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
                                <span class="order-status-badge ${statusClass}">${statusLabels[order.status] || order.status}</span>
                                <span style="font-weight: 700; color: var(--accent);">${order.price}</span>
                                <div class="order-actions">
                                    ${actionsHtml}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // ===== CANCEL ORDER =====
        function cancelOrder(orderId) {
            if (confirm('Are you sure you want to cancel ' + orderId + '?')) {
                var order = ordersData.find(function(o) { return o.id === orderId; });
                if (order) {
                    order.status = 'cancelled';
                    renderOrders(currentFilter);
                    alert('❌ ' + orderId + ' has been cancelled.');
                }
            }
        }

        // ===== FILTER TABS =====
        document.querySelectorAll('.filter-tab').forEach(function(tab) {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.filter-tab').forEach(function(t) { t.classList.remove('active'); });
                this.classList.add('active');
                currentFilter = this.dataset.filter;
                renderOrders(currentFilter);
            });
        });

        // ===== CHECK LOGIN =====
        document.addEventListener('DOMContentLoaded', function() {
            var role = localStorage.getItem('userRole');
            if (role !== 'customer') {
                window.location.href = 'login.html';
                return;
            }
            
            // تحميل الطلبات من localStorage إذا وجدت
            var savedOrders = localStorage.getItem('fixoraOrders');
            if (savedOrders) {
                try {
                    var parsed = JSON.parse(savedOrders);
                    if (parsed.length > 0) {
                        ordersData = parsed;
                    }
                } catch(e) {}
            }
            
            renderOrders('all');
        });

        function handleLogout(event) {
            event.preventDefault();
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('userRole');
            localStorage.removeItem('userEmail');
            localStorage.removeItem('currentExecution');
            localStorage.removeItem('currentOrderDetails');
            window.location.href = 'index.html';
        }
    </script>
    <script src="../js/chatbot.js"></script>

</body>
</html>

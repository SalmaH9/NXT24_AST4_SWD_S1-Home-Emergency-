<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - Fixora</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="../css/register.css" />
</head>
<body>

    <!-- ===== VIBRANT BACKGROUND ===== -->
    <div class="vibrant-bg">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
    </div>

    <!-- ===== REGISTER CONTAINER ===== -->
    <div class="register-container">

        <!-- Header -->
        <div class="register-header">
            <div class="logo-wrapper">
                <i class="fas fa-wrench"></i>
            </div>
            <h1>Create Account</h1>
            <p>Join Fixora and get things fixed</p>
        </div>

        <!-- Register Form -->
        <form class="register-form" id="registerForm" onsubmit="handleRegister(event)">

            <!-- Error Message -->
            <div class="error-message" id="errorMessage">
                <i class="fas fa-circle-exclamation"></i>
                <span id="errorText">Something went wrong</span>
            </div>

            <!-- Role Selector -->
            <div class="role-selector">
                <label class="role-option active" id="customerRole">
                    <input type="radio" name="role" value="customer" checked />
                    <i class="fas fa-user"></i>
                    <span class="role-title">Customer</span>
                    <span class="role-desc">Book Services</span>
                </label>
                <label class="role-option" id="providerRole">
                    <input type="radio" name="role" value="provider" />
                    <i class="fas fa-user-tie"></i>
                    <span class="role-title">Provider</span>
                    <span class="role-desc">Offer Services</span>
                </label>
            </div>

            <!-- Provider Note -->
            <div class="provider-note" id="providerNote">
                <i class="fas fa-info-circle"></i>
                <p>As a provider, you'll need to complete your profile and upload verification documents after registration.</p>
            </div>

            <!-- Full Name -->
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <div class="input-wrapper">
                    <input type="text" id="fullName" placeholder="John Doe" required />
                    <i class="fas fa-user input-icon"></i>
                </div>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-wrapper">
                    <input type="email" id="email" placeholder="you@example.com" required />
                    <i class="fas fa-envelope input-icon"></i>
                </div>
            </div>

            <!-- Phone -->
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <div class="input-wrapper">
                    <input type="tel" id="phone" placeholder="+966 50 123 4567" required />
                    <i class="fas fa-phone input-icon"></i>
                </div>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="••••••••" required minlength="8" />
                    <i class="fas fa-lock input-icon"></i>
                    <button type="button" class="password-toggle" id="togglePassword">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <!-- Confirm Password -->
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <div class="input-wrapper">
                    <input type="password" id="confirmPassword" placeholder="••••••••" required />
                    <i class="fas fa-lock input-icon"></i>
                </div>
            </div>

            <!-- Terms -->
            <div class="terms-check">
                <input type="checkbox" id="agreeTerms" required />
                <label for="agreeTerms">
                    I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
                </label>
            </div>

            <!-- Register Button -->
            <button type="submit" class="btn-register">
                <i class="fas fa-user-plus"></i> Create Account
            </button>

            <!-- Divider -->
            <div class="divider">
                <span>or sign up with</span>
            </div>

            <!-- Social Login -->
            <div class="social-login">
                <a href="#"><i class="fab fa-google"></i></a>
                <a href="#"><i class="fab fa-apple"></i></a>
                <a href="#"><i class="fab fa-github"></i></a>
            </div>
        </form>

        <!-- Footer -->
        <div class="register-footer">
            <p>Already have an account? <a href="login.html">Sign In</a></p>
        </div>

    </div>

    <script src="../js/register.js"></script>
    <script src="../js/chatbot.js"></script>

</body>
</html>

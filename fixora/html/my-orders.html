<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Orders - Fixora</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        .order-card {
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            padding: 20px 24px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            margin-bottom: 16px;
            transition: var(--transition);
        }

        .order-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .order-header .order-id {
            font-weight: 700;
            color: var(--text-primary);
            font-size: 1.05rem;
        }

        .order-header .order-date {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .order-body {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 10px;
        }

        .order-body .service-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .order-body .service-info i {
            font-size: 1.4rem;
            color: var(--accent);
        }

        .order-body .service-info .service-name {
            font-weight: 600;
            color: var(--text-primary);
        }

        .order-body .service-info .service-location {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .order-status-badge {
            padding: 4px 16px;
            border-radius: 60px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .status-pending {
            background: #fef3c7;
            color: #b45309;
        }
        .status-selected {
            background: #dbeafe;
            color: #1e40af;
        }
        .status-examined {
            background: #e0e7ff;
            color: #4338ca;
        }
        .status-progress {
            background: #dbeafe;
            color: #1e40af;
        }
        .status-accepted {
            background: #d1fae5;
            color: #065f46;
        }
        .status-completed {
            background: #d1fae5;
            color: #065f46;
        }
        .status-cancelled {
            background: #fee2e2;
            color: #991b1b;
        }

        .order-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-sm {
            padding: 6px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.8rem;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Inter', sans-serif;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-outline {
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-outline:hover {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .btn-track {
            background: var(--gradient-primary);
            color: white;
        }

        .btn-track:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.35);
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-review {
            background: #f6ad55;
            color: white;
        }

        .btn-review:hover {
            background: #ed8936;
        }

        .filter-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .filter-tab {
            padding: 8px 20px;
            border: 2px solid var(--border);
            border-radius: 60px;
            background: var(--bg-primary);
            color: var(--text-secondary);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: var(--transition);
            font-family: 'Inter', sans-serif;
        }

        .filter-tab:hover,
        .filter-tab.active {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(102, 126, 234, 0.08);
        }

        .filter-tab.active {
            background: var(--accent);
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-light);
        }

        .empty-state i {
            font-size: 3rem;
            color: var(--border);
            margin-bottom: 16px;
        }
        
    </style>
</head>
<body>
    <!-- Mobile Toggle -->
    <button class="sidebar-toggle" id="sidebar-toggle">
        <i class="fas fa-bars"></i>
    </button>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <div class="page-wrapper">
        <!-- SIDEBAR -->
          <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fas fa-wrench"></i>
                    <span>Fix<span class="logo-highlight">ora</span></span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="customer-dashboard.html"><i class="fas fa-gauge-high"></i> Dashboard</a></li>
                    <li><a href="post-request.html"><i class="fas fa-plus-circle"></i> Post Request</a></li>
                    <li><a href="my-orders.html" class="active"><i class="fas fa-list-check"></i> My Orders</a></li>
                    <li><a href="track-order.html" ><i class="fas fa-location-dot"></i> Track Order</a></li>
                    <li><a href="customer-profile.html"><i class="fas fa-user"></i> Profile</a></li>
                    <li style="margin-top: 16px; border-top: 1px solid var(--border); padding-top: 12px;">
                        <a href="index.html" onclick="handleLogout(event)" style="color: #ef4444; font-weight: 600;">
                            <i class="fas fa-sign-out-alt" style="margin-right: 10px;"></i> Logout
                        </a>
                    </li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <button id="theme-toggle" class="theme-btn-sidebar">
                    <i class="fas fa-moon"></i> Dark Mode
                </button>
            </div>
        </aside>

        <!-- MAIN -->
        <div class="main-area">

            <main class="main-content">
                <div class="container">
                    <h1 class="page-title">
                        <i class="fas fa-clock-rotate-left"></i> My Orders
                    </h1>

                    <!-- Filter Tabs -->
                    <div class="filter-tabs">
                        <button class="filter-tab active" data-filter="all">All</button>
                        <button class="filter-tab" data-filter="pending">Pending</button>
                        <button class="filter-tab" data-filter="selected">Selected</button>
                        <button class="filter-tab" data-filter="examined">Examined</button>
                        <button class="filter-tab" data-filter="in-progress">In Progress</button>
                        <button class="filter-tab" data-filter="completed">Completed</button>
                    </div>

                    <!-- Orders List -->
                    <div id="ordersContainer">
                        <!-- Rendered by JavaScript -->
                    </div>

                </div>
            </main>

            <footer class="footer">
                <p>© 2026 <strong>Fixora</strong> — Professional Home Repair Services</p>
                <p class="footer-update">Last updated: <span id="footer-date"></span></p>
            </footer>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/tokenManager.js"></script>
    <script src="../js/loading.js"></script>
    <script src="../js/errorHandler.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/script.js"></script>
    <script>
        var ordersData = [];
        var currentFilter = 'all';

        function mapBackendStatusToFrontend(backendStatus) {
            switch (backendStatus) {
                case 'Pending':
                case 'SearchingForProviders':
                    return 'pending';
                case 'ProviderSelected':
                    return 'selected';
                case 'WaitingForExamination':
                    return 'examined';
                case 'WaitingCustomerApproval':
                    return 'examined';
                case 'InProgress':
                    return 'in-progress';
                case 'Completed':
                    return 'completed';
                case 'Cancelled':
                    return 'cancelled';
                default:
                    return 'pending';
            }
        }

        async function loadMyOrders() {
            try {
                // Fetch categories to resolve names
                const categories = await api.get('/categories', { showLoader: false });
                const catMap = {};
                if (categories) {
                    categories.forEach(c => catMap[c.id] = c.name);
                }

                // Fetch customer service requests
                const requests = await api.get('/service-requests/my-requests');
                if (requests) {
                    ordersData = requests.map(req => {
                        const serviceName = catMap[req.categoryId] || 'Emergency Repair';
                        return {
                            id: req.id,
                            service: serviceName,
                            status: mapBackendStatusToFrontend(req.status),
                            date: req.createdAt ? req.createdAt.split('T')[0] : 'N/A',
                            address: req.address || 'N/A',
                            price: 'EGP 0', // To be populated in Phase 5 when offers exist
                            technician: null,
                            category: serviceName.toLowerCase().replace(/\s+/g, '-'),
                            description: req.description,
                            raw: req
                        };
                    });
                }
                renderOrders(currentFilter);
            } catch (err) {
                console.error('Failed to load customer orders:', err);
            }
        }

        // ===== RENDER ORDERS =====
        function renderOrders(filter) {
            filter = filter || 'all';
            var container = document.getElementById('ordersContainer');
            var filtered = filter === 'all' ? ordersData : ordersData.filter(function(o) { return o.status === filter; });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <p style="font-weight: 600; color: var(--text-secondary);">No orders found</p>
                        <a href="post-request.html" class="btn-primary" style="display: inline-flex; margin-top: 12px;">
                            <i class="fas fa-plus"></i> Post a Request
                        </a>
                    </div>
                `;
                return;
            }

            var html = '';
            filtered.forEach(function(order) {
                var statusClass = {
                    'pending': 'status-pending',
                    'selected': 'status-selected',
                    'examined': 'status-examined',
                    'in-progress': 'status-progress',
                    'accepted': 'status-accepted',
                    'completed': 'status-completed',
                    'cancelled': 'status-cancelled'
                }[order.status] || 'status-pending';

                var statusLabels = {
                    'pending': '⏳ Pending',
                    'selected': '👷 Technician Selected',
                    'examined': '📋 Examination Ready',
                    'in-progress': '🔧 In Progress',
                    'accepted': '✅ Accepted',
                    'completed': '✅ Completed',
                    'cancelled': '❌ Cancelled'
                };

                var icon = {
                    'plumbing': 'fa-faucet',
                    'electrical': 'fa-bolt',
                    'ac-repair': 'fa-snowflake',
                    'carpentry': 'fa-hammer',
                    'painting': 'fa-paint-roller',
                    'masonry': 'fa-trowel',
                    'cleaning': 'fa-broom',
                    'gardening': 'fa-leaf'
                }[order.category] || 'fa-wrench';

                var actionsHtml = '';

                // Details button
                actionsHtml += `
                    <a href="order-details.html?id=${order.id}" class="btn-sm btn-outline">
                        <i class="fas fa-eye"></i> Details
                    </a>
                `;

                if (order.status === 'pending') {
                    actionsHtml += `
                        <button class="btn-sm btn-review" onclick="viewOffers('${order.id}')">
                            <i class="fas fa-handshake"></i> View Offers
                        </button>
                    `;
                }

                if (order.status === 'selected') {
                    actionsHtml += `
                        <button class="btn-sm btn-review" onclick="viewExamination('${order.id}')">
                            <i class="fas fa-file-medical"></i> View Examination
                        </button>
                    `;
                }

                if (order.status === 'examined') {
                    actionsHtml += `
                        <button class="btn-sm btn-review" onclick="reviewReport('${order.id}')">
                            <i class="fas fa-file-contract"></i> Review Report
                        </button>
                    `;
                }

                if (order.status === 'in-progress' || order.status === 'accepted') {
                    actionsHtml += `
                        <a href="execution.html?id=${order.id}" class="btn-sm btn-track">
                            <i class="fas fa-location-dot"></i> Track
                        </a>
                    `;
                }

                if (order.status === 'completed') {
                    actionsHtml += `
                        <a href="rating.html?id=${order.id}" class="btn-sm btn-review">
                            <i class="fas fa-star"></i> Rate
                        </a>
                    `;
                }

                if (order.status !== 'completed' && order.status !== 'cancelled') {
                    actionsHtml += `
                        <button class="btn-sm btn-danger" onclick="cancelOrder('${order.id}')">
                            <i class="fas fa-xmark"></i> Cancel
                        </button>
                    `;
                }

                html += `
                    <div class="order-card">
                        <div class="order-header">
                            <span class="order-id">#ID-${order.id.substring(0, 8).toUpperCase()}</span>
                            <span class="order-date"><i class="far fa-calendar"></i> ${order.date}</span>
                        </div>
                        <div class="order-body">
                            <div class="service-info">
                                <i class="fas ${icon}"></i>
                                <div>
                                    <div class="service-name">${order.service}</div>
                                    <div class="service-location"><i class="fas fa-location-dot" style="font-size: 0.7rem;"></i> ${order.address}</div>
                                    ${order.technician ? `<div style="font-size: 0.8rem; color: var(--text-secondary);"><i class="fas fa-user"></i> ${order.technician}</div>` : ''}
                                </div>
                            </div>
                            <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
                                <span class="order-status-badge ${statusClass}">${statusLabels[order.status] || order.status}</span>
                                <div class="order-actions">
                                    ${actionsHtml}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        async function cancelOrder(orderId) {
            if (confirm('Are you sure you want to cancel this service request?')) {
                try {
                    await api.delete(`/service-requests/${orderId}`);
                    ErrorHandler.showNotification('Success', 'Request has been cancelled successfully.', 'success');
                    loadMyOrders();
                } catch (err) {
                    console.error('Failed to cancel request:', err);
                }
            }
        }

        function viewExamination(orderId) {
            localStorage.setItem('currentRequestId', orderId);
            window.location.href = 'examination.html';
        }

        function reviewReport(orderId) {
            localStorage.setItem('currentRequestId', orderId);
            window.location.href = 'examination.html';
        }

        async function viewOffers(orderId) {
            try {
                const req = await api.get(`/service-requests/${orderId}`);
                if (req) {
                    localStorage.setItem('currentRequest', JSON.stringify(req));
                    window.location.href = 'select-technician.html';
                }
            } catch (err) {
                console.error('Failed to view offers:', err);
            }
        }

        // ===== FILTER TABS =====
        document.querySelectorAll('.filter-tab').forEach(function(tab) {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.filter-tab').forEach(function(t) { t.classList.remove('active'); });
                this.classList.add('active');
                currentFilter = this.dataset.filter;
                renderOrders(currentFilter);
            });
        });

        // ===== CHECK LOGIN & LOAD =====
        document.addEventListener('DOMContentLoaded', function() {
            if (Auth.checkAuth(['customer'])) {
                loadMyOrders();
            }
            
            var footerDate = document.getElementById('footer-date');
            if (footerDate) {
                footerDate.textContent = new Date().toLocaleDateString('en-US', {
                    year: 'numeric', month: 'short', day: 'numeric'
                });
            }
        });

        function handleLogout(event) {
            event.preventDefault();
            Auth.logout();
        }
    </script>
    <script src="../js/chatbot.js"></script>

</body>
</html>

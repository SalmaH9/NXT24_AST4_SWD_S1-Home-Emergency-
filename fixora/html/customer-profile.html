<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile - Fixora</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        .profile-container {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
        }

        .profile-sidebar {
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            padding: 30px 24px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            text-align: center;
            height: fit-content;
        }

        .profile-avatar-large {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: var(--gradient-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: white;
            margin: 0 auto 12px;
        }

        .profile-sidebar h3 {
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .profile-sidebar .role-tag {
            display: inline-block;
            background: var(--accent);
            color: white;
            padding: 4px 16px;
            border-radius: 60px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .profile-sidebar .member-since {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-top: 8px;
        }

        .profile-form {
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            padding: 30px 28px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        .profile-form h3 {
            color: var(--text-primary);
            margin-bottom: 20px;
            font-size: 1.1rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: 12px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            transition: var(--transition);
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.12);
        }

        .btn-save {
            padding: 12px 32px;
            background: var(--gradient-primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Inter', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.35);
        }

        @media (max-width: 768px) {
            .profile-container {
                grid-template-columns: 1fr;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- Mobile Toggle -->
    <button class="sidebar-toggle" id="sidebar-toggle">
        <i class="fas fa-bars"></i>
    </button>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <div class="page-wrapper">
        <!-- SIDEBAR -->
         <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fas fa-wrench"></i>
                    <span>Fix<span class="logo-highlight">ora</span></span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="customer-dashboard.html"><i class="fas fa-gauge-high"></i> Dashboard</a></li>
                    <li><a href="post-request.html"><i class="fas fa-plus-circle"></i> Post Request</a></li>
                    <li><a href="my-orders.html"><i class="fas fa-list-check"></i> My Orders</a></li>
                    <li><a href="track-order.html"><i class="fas fa-location-dot"></i> Track Order</a></li>
                    <li><a href="customer-profile.html" class="active"><i class="fas fa-user"></i> Profile</a></li>
                    <li style="margin-top: 16px; border-top: 1px solid var(--border); padding-top: 12px;">
                        <a href="index.html" onclick="handleLogout(event)" style="color: #ef4444; font-weight: 600;">
                            <i class="fas fa-sign-out-alt" style="margin-right: 10px;"></i> Logout
                        </a>
                    </li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <button id="theme-toggle" class="theme-btn-sidebar">
                    <i class="fas fa-moon"></i> Dark Mode
                </button>
            </div>
        </aside>

        <!-- MAIN -->
        <div class="main-area">

    <!-- ===== MAIN ===== -->
    <main class="main-content">
        <div class="container">
            <h1 class="page-title">
                <i class="fas fa-user"></i> My Profile
            </h1>

            <div class="profile-container">

                <!-- Sidebar -->
                <div class="profile-sidebar">
                    <div class="profile-avatar-large">
                        <i class="fas fa-user"></i>
                    </div>
                    <h3 id="profileName">Ahmed Al-Saud</h3>
                    <span class="role-tag">Customer</span>
                    <p class="member-since">Member since Jan 2024</p>
                    <div style="margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border);">
                        <div style="display: flex; justify-content: space-around;">
                            <div>
                                <div style="font-weight: 900; color: var(--text-primary);">12</div>
                                <div style="font-size: 0.75rem; color: var(--text-secondary);">Orders</div>
                            </div>
                            <div>
                                <div style="font-weight: 900; color: var(--text-primary);">4.9</div>
                                <div style="font-size: 0.75rem; color: var(--text-secondary);">Rating</div>
                            </div>
                            <div>
                                <div style="font-weight: 900; color: var(--text-primary);">8</div>
                                <div style="font-size: 0.75rem; color: var(--text-secondary);">Completed</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Form -->
                <div class="profile-form">
                    <h3><i class="fas fa-pen" style="color: var(--accent);"></i> Edit Profile</h3>

                    <form onsubmit="saveProfile(event)">
                        <div class="form-row">
                            <div class="form-group">
                                <label>Full Name</label>
                                <input type="text" id="fullName" value="Ahmed Al-Saud" />
                            </div>
                            <div class="form-group">
                                <label>Email Address</label>
                                <input type="email" id="email" value="ahmed@example.com" />
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label>Phone Number</label>
                                <input type="tel" id="phone" value="+966 50 123 4567" />
                            </div>
                            <div class="form-group">
                                <label>City</label>
                                <select id="city">
                                    <option selected>Riyadh</option>
                                    <option>Jeddah</option>
                                    <option>Dammam</option>
                                    <option>Mecca</option>
                                    <option>Medina</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Address</label>
                            <input type="text" id="address" value="123 Main Street, Al-Malaz, Riyadh" />
                        </div>

                        <button type="submit" class="btn-save">
                            <i class="fas fa-floppy-disk"></i> Save Changes
                        </button>
                    </form>
                </div>

            </div>
        </div>
    </main>

            <footer class="footer">
                <p>© 2026 <strong>Fixora</strong> — Professional Home Repair Services</p>
                <p class="footer-update">Last updated: <span id="footer-date"></span></p>
            </footer>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/tokenManager.js"></script>
    <script src="../js/loading.js"></script>
    <script src="../js/errorHandler.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        let currentProfileData = null;

        async function loadProfile() {
            try {
                const profile = await api.get('/profile');
                if (profile) {
                    currentProfileData = profile;
                    document.getElementById('profileName').textContent = profile.fullName;
                    document.getElementById('fullName').value = profile.fullName;
                    document.getElementById('email').value = profile.email;
                    document.getElementById('phone').value = profile.phoneNumber || '';
                    
                    if (profile.customerProfile) {
                        document.getElementById('address').value = profile.customerProfile.defaultAddress || '';
                        const citySelect = document.getElementById('city');
                        if (profile.customerProfile.preferredLanguage) {
                            // Find and select the option matching preferredLanguage (city)
                            for (let i = 0; i < citySelect.options.length; i++) {
                                if (citySelect.options[i].text === profile.customerProfile.preferredLanguage) {
                                    citySelect.selectedIndex = i;
                                    break;
                                }
                            }
                        }
                    }
                }
            } catch (err) {
                console.error('Failed to load profile:', err);
            }
        }

        async function saveProfile(event) {
            event.preventDefault();
            const fullName = document.getElementById('fullName').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const address = document.getElementById('address').value.trim();
            const city = document.getElementById('city').value;

            if (!fullName) {
                ErrorHandler.showNotification('Validation Error', 'Full Name is required', 'error');
                return;
            }

            try {
                const success = await api.put('/profile', {
                    fullName: fullName,
                    phoneNumber: phone,
                    defaultAddress: address,
                    preferredLanguage: city // Map city selection to preferredLanguage DTO field
                });

                if (success) {
                    document.getElementById('profileName').textContent = fullName;
                    ErrorHandler.showNotification('Success', 'Profile updated successfully!', 'success');
                }
            } catch (err) {
                console.error('Failed to save profile:', err);
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            if (Auth.checkAuth(['customer'])) {
                loadProfile();
            }
            
            // Set footer date
            const dateEl = document.getElementById('footer-date');
            if (dateEl) {
                dateEl.textContent = new Date().toLocaleDateString('en-US', {
                    year: 'numeric', month: 'short', day: 'numeric'
                });
            }
        });

        function handleLogout(event) {
            event.preventDefault();
            Auth.logout();
        }
    </script>
</body>
</html>
